/* ---------- REPORTS: the archive ----------
   Every check-up keeps its own dated report. Nothing overwrites. */
function vReports(){
  const rows=REPORTS.map((r,i)=>{
    const sc=scoresOf(r), ph=currentPhase(sc), tot=totalAt(r.r);
    const prev=i>0?REPORTS[i-1]:null;
    const pph=prev?currentPhase(scoresOf(prev)):null;
    const dt=prev?tot-totalAt(prev.r):null;
    let delta='';
    if(prev){
      const bits=[];
      /* Independent clauses in a list, not one sentence cut into pieces —
         each is whole and a translator can rewrite it without the others. */
      if(ph>pph) bits.push(`<b class="up">${t('reports.d.up',{phase:pname(PHASES[pph-1])})}</b>`);
      else if(ph<pph) bits.push(`<b class="dn">${t('reports.d.down',{phase:pname(PHASES[ph-1])})}</b>`);
      else bits.push(t('reports.d.same'));
      if(dt>0) bits.push(tn('reports.d.more',dt)); else if(dt<0) bits.push(tn('reports.d.fewer',-dt));
      const g=reportGist(r); if(g.weakest) bits.push(t('reports.d.weakest',{cat:catLabel(g.weakest)}));
      delta=bits.join(' · ');
    } else { const g0=reportGist(r);
      delta=t('reports.d.first')+(g0.weakest?' &middot; '+t('reports.d.weakest',{cat:catLabel(g0.weakest)}):''); }
    return {r,i,sc,ph,tot,delta};
  }).reverse();

  return `<div class="view"><div class="wrap">
    <div class="eyebrow">${tn('reports.eyebrow',REPORTS.length)}</div>
    <h1>${t('reports.title')}</h1>
    <p class="lede">${t('reports.lede')}</p>
    <div style="margin-top:26px;display:flex;flex-direction:column;gap:10px">
      ${rows.map(x=>`<button class="repcard ${x.i===REPORTS.length-1?'newest':''}" data-open="${x.i}">
        <div class="rc-date"><span class="d">${fmtDate(x.r)}</span><span class="t">${x.r.t}</span></div>
        <div class="rc-mid">
          <div class="rc-phase"><i></i>${pname(PHASES[x.ph-1])}</div>
          <div class="rc-delta">${x.delta}</div>
        </div>
        <div class="rc-n"><b>${x.tot}</b><span>${t('today.students')}</span></div>
        <div class="rc-go">${t('today.open')}</div>
      </button>`).join('')}
    </div>
    <p class="note" style="margin-top:18px">${t('reports.note')}</p>
  </div></div>`;
}

/* ---------- REPORT ---------- */
function vReport(){
  const R=rep(), sc=scoresOf(R), ph=currentPhase(sc), cats=catScores(R);
  const c=zoneCounts(R.r), tot=c.reduce((a,b)=>a+b,0);
  const cov=coverage();
  const prev=openIx>0?REPORTS[openIx-1]:null;
  const pph=prev?currentPhase(scoresOf(prev)):null;
  const ranked=Object.entries(cats).sort((a,b)=>a[1].v-b[1].v);
  const low=ranked.slice(0,3);

  const weakFreq=ZONES.map(z=>({z,best:Math.max(0,...cov[z.n].map(p=>FREQ_RANK[p.freq]))})).filter(x=>x.best===1)[0];
  const gapZone=ZONES.find(z=>!cov[z.n].length);
  const acts=[];
  if(weakFreq){const wz=weakFreq.z, only=cov[wz.n][0];
    /* TRANSLATION TRAP: toLowerCase on a frequency word is an English
       habit. German capitalises nouns and Czech declines them, so a
       translator may need the frequency to arrive unchanged — the key
       carries the whole clause so they can rewrite around it. */
    acts.push({b:t('report.act.freq',{verb:zverb(wz), n:c[wz.n-1]+c[0], prog:only.name}),
    w:t('report.act.freq.w',{band:slugLabel(cats.CPR.v), prog:only.name, freq:only.freq.toLowerCase()})});}
  if(gapZone) acts.push({b:t('report.act.gap',{sent:c[4], ready:c[3]}),
    w:t('report.act.gap.w',{band:slugLabel(cats.Entrust.v), ready:zoneCounts(R.r)[3]})});
  const used=acts.map(a=>a.w).join(' ');
  const fresh=low.find(k=>!used.includes(k[0]))||low[0];
  acts.push({b:t('report.act.weak',{cat:catLabel(fresh[0]), band:slugLabel(fresh[1].v), phase:pfull(PHASES[ph-1])}),
    w:tn('report.act.weak.w',fresh[1].n,{cat:catLabel(fresh[0]), of:ranked.length})});

  return `<div class="view"><div class="wrap">
    <button class="backlink" data-go="reports">${t('report.back')}</button>

    <div class="cover">
      <div class="cover-date">${fmtDate(R)} &middot; ${R.t}${openIx===REPORTS.length-1?` <span class="pill">${t('report.latest')}</span>`:''}</div>
      <div class="cover-grid">
        <div class="cv"><b>${tot}</b><span>${t('report.cover.students')}</span></div>
        <div class="cv"><b class="ph">${pname(PHASES[ph-1])}</b><span>${t('report.cover.phase',{n:ph})}${prev&&ph>pph?' &middot; '+t('report.cover.upfrom',{prev:pname(PHASES[pph-1])}):''}</span></div>
        <div class="cv"><b>${c[3]+c[4]}</b><span>${t('report.cover.beyond')}</span></div>
        <div class="cv"><b>${ZONES.filter(z=>cov[z.n].length).length}<span class="of">/5</span></b><span>${t('report.cover.invites')}</span></div>
      </div>
      <div class="cover-bar">${c.map((n,i)=>n?`<div style="flex:${n};background:var(${ZONES[i].v})"></div>`:'').join('')}</div>
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('report.sec.phase')}</h2><span class="n">${t('report.tap')}</span></div>
      <div class="card">
        ${phaseCakeHTML(sc,ph,true)}
        <p class="note" style="margin-top:12px">${t('today.plinth.phase')}. ${selPhase?'':t('report.cake.hint')}</p>
        ${selPhase?phaseWhy(selPhase,ph,R):''}
      </div>
    </div>

    ${(()=>{const tk=PHASES[ph-1].tool,T=TOOLS[tk];
      const parts=T.words.map(w=>[w,cats[w]]).filter(x=>x[1]);
      return `<div class="sec">
      <div class="sec-hd"><h2>${t('report.how',{phase:pname(PHASES[ph-1])})}</h2><span class="n">${t('report.tool.tag')}</span></div>
      <div class="toolbox">
        <div class="tb-head"><button class="tb-acr" data-tool="${tk}" title="${plain(t('report.tool.title',{tool:tk}))}">${tk}</button><p>${T.spells.map(spellLabel).join(' &middot; ')}</p></div>
        <p class="tb-scale">${t('report.tool.scale')}</p>
        <div class="tb-words">
          ${parts.map(x=>{const b=band(x[1].v);return `<button class="tw ${b.k}" data-tool="${x[0]}"><div class="tw-w">${catLabel(x[0])}${isTool(x[0])&&T.letters.length===1&&x[0]!==tk?` <span class="acrtag mine">${tk}</span>`:''}</div>
            ${pips(x[1].v)}<div class="tw-v">${doingBand(x[1].v)}</div>
            <div class="tw-n">${tn('report.statements',x[1].n)}</div></button>`}).join('')}
        </div>
      </div>
      ${(()=>{const w=parts.slice().sort((a,b)=>a[1].v-b[1].v)[0];
        if(!w) return '';
        return `<p class="note" style="margin-top:12px">${t('report.weakest',{part:catLabel(w[0])})} ${
          w[0]===tk
            ? t('report.weakest.istool',{tool:tk, spells:T.spells.map(spellLabel).join(', ').toLowerCase()})
          : isTool(w[0])
            ? t('report.weakest.partof',{tool:tk})
            : t('report.weakest.beside',{tool:tk})}</p>`})()}
    </div>`})()}

    <div class="sec">
      <div class="sec-hd"><h2>${t('report.donext')}</h2><span class="n">${t('report.bothsources')}</span></div>
      ${acts.map((a,ix)=>`<div class="act"><div class="num">0${ix+1}</div><div class="bd">${a.b}<div class="why">${a.w}</div></div></div>`).join('')}
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('report.questions')}</h2><span class="n">${t('report.coachtag')}</span></div>
      ${coachHTML()}
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('report.invites')}</h2><span class="n">${t('report.mapdata')}</span></div>
      <div class="zonebar">
        ${ZONES.map((z,i)=>`<div class="zcol" style="--zc:var(${z.v})">
          <div class="zhd"><div class="zname">${zname(z)}</div><div class="zcount">${c[i]}</div></div>
          <div class="zbody">${cov[z.n].length?cov[z.n].map(p=>`<div class="chip"><span>${p.name}</span><span class="mv ${p.freq==='Yearly'?'back':''}">${freqLabel(p.freq)}</span></div>`).join(''):`<div class="chip" style="background:none;box-shadow:inset 0 0 0 1.5px var(--ink-15);color:var(--ink-45);font-style:italic">${t('report.notcovered')}</div>`}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('report.every')}</h2><span class="n">${t('report.measured',{n:ranked.length})}</span></div>
      ${(()=>{
        /* Grouped by phase, and inside a phase in the tool's own order —
           so REST reads Restructure, Entrust, Support, Train. Sorting the
           whole list by score scattered the letters and the acronym beside
           each one stopped meaning anything. The weakest is still called
           out by name in the panel above. */
        const order=[]; PHASES.forEach(ps=>TOOLS[ps.tool].words.forEach(w=>order.push(w)));
        return order.filter(w=>cats[w]).map(w=>[w,cats[w]]);})()
        .map(k=>{const b=band(k[1].v),acr=CAT_TOOL[k[0]],mine=CAT_PHASE[k[0]]===ph;
        return `<div class="bar ${b.k}"><div class="lb">${catLabel(k[0])}${acr?`<span class="acrtag ${mine?'mine':''}">${acr}</span>`:''}${mine?`<span class="tag">${t('report.yourphase')}</span>`:''}</div>${pips(k[1].v)}<div class="vl">${bandLabel(k[1].v)}</div></div>`}).join('')}
    </div>
  </div></div>`;
}

/* the story of a phase, read from the statements */

/* Two kinds of content on this card, and they are marked apart.
   Sourced: the phase name, its tool and what the acronym spells, who it is
   aimed at, how long it typically runs, and the leader's own answers.
   Placeholder: everything from STORY, which was written here. It carries an
   asterisk and a footnote saying so, so nobody reads it as JV's teaching. */
function phaseWhy(n,cur,R){
  const p=PHASES[n-1], st=STORY[n];
  const qs=Q.filter(q=>q.phase===n).map(q=>({...q,a:ansIn(R,q)}));
  const tiers=[
    {k:'true', hd:t('phase.tf.true'), list:qs.filter(q=>q.a>=A_TRUE)},
    {k:'part', hd:t('phase.tf.part'), list:qs.filter(q=>q.a===A_LITTLE)},
    {k:'not',  hd:t('phase.tf.not'),  list:qs.filter(q=>q.a===A_NONE)}
  ];
  const prev=n>1?Q.filter(q=>q.phase===n-1).map(q=>({...q,a:ansIn(R,q)})).sort((a,b)=>b.a-a.a).slice(0,2):[];
  const sc=scoresOf(R);

  let stance;
  if(n===cur) stance=t('phase.stance.now');
  else if(n<cur) stance=t('phase.stance.past');
  else stance=t('phase.stance.ahead',{phase:pname(PHASES[cur-1])});

  const tk=p.tool, T=TOOLS[tk];
  return `<div class="why-panel">
    <div class="ph-head">
      <div class="ph-essence">&ldquo;${st.essence}&rdquo;<sup class="ph-ast" title="${plain(t('phase.ast'))}">*</sup></div>
      <div class="ph-stance">${stance} ${t('phase.outof',{score:sc[n].toFixed(1)})}</div>
    </div>
    <div class="ph-meta">
      <span><b>${tk}</b>${T.spells.map(spellLabel).join(' &middot; ')}</span>
      <span><b>${t('learn.ph.who')}</b>${pwho(p)}</span>
      <span><b>${t('learn.ph.span')}</b>${pspan(p)}<sup class="ph-ast">*</sup></span>
    </div>

    <p class="ph-about">${st.about}<sup class="ph-ast">*</sup></p>
    ${st.turn?`<div class="ph-turn"><span>${t('phase.turn')}<sup class="ph-ast">*</sup></span>${st.turn}</div>`:''}

    <div class="tf-grid">
      ${tiers.map(tr=>`<div>
        <div class="tf-hd ${tr.k}">${tr.hd}<span>${tr.list.length}</span></div>
        ${tr.list.length?tr.list.map(q=>`<div class="tf ${tr.k}">${qtext(q)}</div>`).join(''):'<div class="tf none">&mdash;</div>'}
      </div>`).join('')}
    </div>

    ${prev.length?`<div class="ph-carry">
      <div class="eyebrow">${t('phase.carry',{phase:pname(PHASES[n-2])})}</div>
      ${prev.map(q=>`<div class="carry-line">${qtext(q)}</div>`).join('')}
    </div>`:''}

    <div class="ph-foot">
      <div><div class="eyebrow">${t('phase.wrong')}<sup class="ph-ast">*</sup></div><p>${st.risk}</p></div>
      <div><div class="eyebrow">${n===5?t('phase.here'):t('phase.finished',{phase:pname(p)})}<sup class="ph-ast">*</sup></div><p>${st.door}</p></div>
    </div>

    <p class="ph-note">${t('phase.note')}</p>
  </div>`;
}

/* ---------- COACH ----------
   Live. Talks to Claude with the report AND the roster in the prompt —
   which is the whole reason the merge is worth doing: neither source
   alone can produce a question with a student's name in it.
   In production this call goes through a Netlify function so the key
   stays server-side; set CONFIG.coachEndpoint and it will use that. */
const CONFIG={coachEndpoint:'/api/claude', notesEndpoint:'/api/notes', sendNames:true};
/* Marks a request as coming from this app. A same-origin GET sends no Origin
   header and this site sends no Referer, so without this the front door in
   netlify/functions/lib/guard.js has nothing to recognise and refuses us. */
const APP_HDR={'X-Ministry-Map':'1'};
let coachState={loading:false,questions:null,error:null,answer:null,asking:false};

function coachPayload(){
  const R=rep(), sc=scoresOf(R), ph=currentPhase(sc), cats=catScores(R);
  const c=zoneCounts(R.r), cov=coverage(), P=PHASES[ph-1], T=TOOLS[P.tool];
  const anon=x=>CONFIG.sendNames?x.name:'a student';
  const F=REPORTS[0];
  return {
    takenAt:R.d+' '+R.t,
    phase:P.name, aimedAt:P.who,
    tool:{acronym:P.tool, isLetterOfTool:T.letters,
          parts:T.words.map(w=>cats[w]?`${w}: ${band(cats[w].v).l.toLowerCase()} (from ${cats[w].n} statement${cats[w].n>1?'s':''})`:w)},
    /* English on purpose: the coach prompt quotes the instrument as JV
       wrote it, so the model reasons against one fixed wording whatever
       language the leader is reading in. */
    trueOfUs:Q.filter(q=>q.phase===ph&&ansIn(R,q)>=A_TRUE).map(q=>q.t),
    notYetTrue:Q.filter(q=>q.phase===ph&&ansIn(R,q)===A_NONE).map(q=>q.t),
    furthestInvitationSaidYesTo:ZONES.map((z,i)=>({invitation:plain(z.name),means:plain(z.ask),students:c[i]})),
    programs:PROGRAMS.map(p=>({name:p.name,runs:p.freq,wheretheseinvitationsgetmade:p.ch.map(x=>plain(ZONES[x-1].name))})),
    invitationsNeverMade:ZONES.filter(z=>!cov[z.n].length).map(z=>plain(z.name)),
    ...(hasNames()?{
      movedForwardSinceLastCheckup:STUDENTS.filter(x=>x.hist[1]&&x.hist[R.r]>x.hist[1]).map(anon),
      notMovedInTenMonths:STUDENTS.filter(x=>x.hist[F.r]&&x.hist[F.r]===x.hist[R.r]).map(anon)
    }:{
      /* Say the absence out loud. Left unsaid, the model invents a student. */
      noRosterYet:'This leader has given counts, not students. You do not know any student individually, and you must not write as though you do. Ask about the pattern, never about a person.'
    }),
    language:'English'
  };
}

const COACH_SYS=`You are a coach for youth leaders in Central and Eastern Europe, working inside Josiah Venture's Five Phases framework.
The Five Challenges of Christ are INVITATIONS a leader makes to a student, not programmes, events or containers. "Repent & Believe" means asking a student to turn from their old life and give it to Christ. "I Am Sending You" means asking a student to go and lead somewhere you are not. A student's position on the map is the furthest invitation they have said yes to. Never write as though a challenge is a place a student sits in, a thing a programme "carries", or an event on a calendar — write about who has been asked and who has not.
You are given one ministry check-up: the leader's own answers about their ministry, AND live data about the actual students on their map.
Write questions a wise mentor would ask — specific, warm, never flattering and never scolding. Ground every question in something concrete from the data, preferring facts that combine BOTH sources (e.g. a low score next to a real student who is stuck).
Never give advice or action steps. Only questions. A good question makes the leader think of the answer themselves.
Never smuggle your suggestion into the question. Do not name a month, a programme, an event or a plan the leader has not mentioned — "what stops you from asking in November?" is your idea wearing a question mark. Ask about the pattern instead: what stops you asking more often, what has kept you from asking them, what would have to change. The leader supplies the when and the how.
Return ONLY a JSON array, no preamble and no markdown fences:
[{"q":"the question, 1-2 sentences","from":"the evidence, under 12 words, lowercase"}]
Exactly 3 objects.`;

async function callClaude(system,user,maxTokens){
  const r=await fetch(CONFIG.coachEndpoint,{method:'POST',headers:{'Content-Type':'application/json',...APP_HDR},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens||1000,system,messages:[{role:'user',content:user}]})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  return (d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');
}

async function runCoach(){
  coachState={loading:true,questions:null,error:null,answer:null,asking:false}; render();
  try{
    const txt=await callClaude(COACH_SYS,'Here is the check-up:\n\n'+JSON.stringify(coachPayload(),null,1));
    const clean=txt.replace(/```json|```/g,'').trim();
    const arr=JSON.parse(clean.slice(clean.indexOf('['),clean.lastIndexOf(']')+1));
    coachState={loading:false,questions:arr,error:null,answer:null,asking:false};
  }catch(err){ coachState={loading:false,questions:null,error:String(err.message||err),answer:null,asking:false}; }
  render();
}

async function askCoach(q){
  if(!q||!q.trim())return;
  coachState={...coachState,asking:true,answer:null}; render();
  try{
    const txt=await callClaude(
      'You are a coach for a youth leader, working inside Josiah Venture\'s Five Phases framework. You are given their ministry check-up and their live student roster. Answer in 2-4 short paragraphs, plain and warm, grounded in the data you were given. Cite specific numbers or students where they support the point. If the data cannot answer the question, say so plainly rather than guessing.',
      'The check-up:\n\n'+JSON.stringify(coachPayload(),null,1)+'\n\nThe leader asks: '+q, 1000);
    coachState={...coachState,asking:false,answer:txt};
  }catch(err){ coachState={...coachState,asking:false,answer:null,error:String(err.message||err)}; }
  render();
}

function vTime(){
  const F=REPORTS[0], L=REPORTS[REPORTS.length-1];
  const fPh=currentPhase(scoresOf(F)), lPh=currentPhase(scoresOf(L));
  const t0=totalAt(F.r), t1=totalAt(L.r);
  const months=Math.round((new Date(L.d)-new Date(F.d))/2629800000);

  /* --- people. Only a roster can follow a person across a year; counts
         can only show the shape changing. Both are true, one is smaller. --- */
  const named=hasNames();
  const started=named?STUDENTS.filter(x=>x.hist[F.r]):[];
  const advanced=named?started.filter(x=>x.hist[L.r]>x.hist[F.r]):[];
  const crossings=named?advanced.reduce((a,x)=>a+(x.hist[L.r]-x.hist[F.r]),0):0;
  const stuck=named?started.filter(x=>x.hist[L.r]===x.hist[F.r]):[];
  const joined=named?STUDENTS.filter(x=>!x.hist[F.r]&&x.hist[L.r]):[];
  const furthest=named?advanced.slice().sort((a,b)=>(b.hist[L.r]-b.hist[F.r])-(a.hist[L.r]-a.hist[F.r]))[0]:null;
  const dDeep=deeper(L.r)-deeper(F.r);

  /* --- instrument --- */
  const became=Q.filter(q=>ansIn(F,q)<A_TRUE&&ansIn(L,q)>=A_TRUE);
  const slipped=Q.filter(q=>ansIn(L,q)<ansIn(F,q));
  const frozen=Q.filter(q=>ansIn(F,q)===A_NONE&&ansIn(L,q)===A_NONE);

  /* --- time spent in each phase, from the reports themselves --- */
  const legs=[];
  REPORTS.forEach((r,i)=>{
    const p=currentPhase(scoresOf(r));
    const last=legs[legs.length-1];
    if(last&&last.p===p) last.to=r.d; else legs.push({p,from:r.d,to:r.d});
  });
  const span=new Date(L.d)-new Date(F.d);
  legs.forEach((g,i)=>{
    const end=i<legs.length-1?new Date(legs[i+1].from):new Date(L.d);
    g.w=Math.max(((end-new Date(g.from))/span)*100,i===legs.length-1?20:12);
    g.mo=Math.max(Math.round((end-new Date(g.from))/2629800000),0);
  });

  const stat=(n,l,sub)=>`<div class="jstat"><b>${n}</b><span>${l}</span>${sub?`<em>${sub}</em>`:''}</div>`;

  return `<div class="view"><div class="wrap">
    <div class="eyebrow">${t('time.eyebrow',{from:fmtDate(F), to:fmtDate(L),
        months:tn('span.months',months), checks:tn('time.checkups',REPORTS.length)})}</div>
    <!-- KNOWN BUG, kept verbatim through the extraction: "Foundation" is
         hard-coded where the FIRST phase name belongs (PHASES[fPh-1]). It is
         only right when the year started in Foundation. Extraction is not
         allowed to change words, so it is reported rather than fixed here. -->
    <h1>${t('time.title',{t0, t1, phase:pname(PHASES[lPh-1])})}</h1>

    <div class="jstats">
      ${stat((t1-t0>=0?'+':'')+(t1-t0),t('time.more'),named?t('time.more.named',{n:joined.length}):t('time.more.open'))}
      ${named
        ? stat(crossings,t('time.crossed'),t('time.crossed.sub',{a:advanced.length,b:started.length}))
        : stat((dDeep>=0?'+':'')+dDeep,t('time.further'),t('time.further.sub'))}
      ${stat(became.length+'/35',t('time.became'),t('time.became.sub'))}
      ${stat(lPh-fPh,t('time.climbed'),t('time.climbed.sub',{a:pname(PHASES[fPh-1]),b:pname(PHASES[lPh-1])}))}
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('time.shape')}</h2><span class="n">${t('time.thennow')}</span></div>
      ${(()=>{const mx=Math.max(1,...zoneCounts(F.r),...zoneCounts(L.r));
        return `<div class="tnstack">
          <div class="tn-one"><div class="tn-lab">${fmtDate(F)}<span>${tn('time.students',t0)}</span></div>
            ${roadHTML(F.r,{mx})}</div>
          <div class="tn-one now"><div class="tn-lab">${fmtDate(L)}<span>${tn('time.students',t1)}</span></div>
            ${roadHTML(L.r,{mx})}</div>
        </div>`})()}
      <p class="note" style="margin-top:14px">${t('time.shape.note')}${furthest?' '+t('time.shape.moved',{who:furthest.name,
          from:plain(zname(ZONES[furthest.hist[F.r]-1])), to:plain(zname(ZONES[furthest.hist[L.r]-1]))})
        :named?' '+t('time.shape.stillnone'):''}</p>
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('time.legs')}</h2><span class="n">${t('time.legs.tag')}</span></div>
      <div class="legs">
        ${legs.map((g,i)=>`<div class="leg ${i===legs.length-1?'now':''}" style="width:${g.w}%">
          <span class="lg-n">${pname(PHASES[g.p-1])}</span>
          <span class="lg-t">${i===legs.length-1?t('time.now'):t('time.approx',{n:g.mo})}</span></div>`).join('')}
      </div>
      <p class="note" style="margin-top:12px">${t('time.legs.note')}</p>
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('time.sec.became')}</h2><span class="n">${tn('time.nstatements',became.length)}</span></div>
      <div class="tf-grid" style="grid-template-columns:1fr 1fr">
        <div>
          <div class="tf-hd true">${t('time.nowtrue')}<span>${became.length}</span></div>
          ${became.map(q=>`<div class="tf true">${qtext(q)}<span class="qp">${pname(PHASES[q.phase-1])} &middot; ${catLabel(q.cat)}</span></div>`).join('')}
        </div>
        <div>
          <div class="tf-hd not">${t('time.unmoved')}<span>${frozen.length}</span></div>
          ${frozen.slice(0,6).map(q=>`<div class="tf not">${qtext(q)}<span class="qp">${pname(PHASES[q.phase-1])} &middot; ${catLabel(q.cat)}</span></div>`).join('')}
          ${frozen.length>6?`<p class="note" style="margin-top:10px">${tn('time.andmore',frozen.length-6,{phase:pname(PHASES[4])})}</p>`:''}
        </div>
      </div>
      ${slipped.length?`<p class="note" style="margin-top:14px">${tn('time.slipped',slipped.length)}</p>`:''}
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('time.stuck')}</h2><span class="n">${named?t('time.stuck.n',{n:stuck.length,of:started.length}):t('time.stuck.unknown')}</span></div>
      ${named
        ? `<div class="stuckrow">${stuck.map(x=>`<span class="sc" style="--zc:var(${ZONES[x.hist[L.r]-1].v})">${x.name}<em>${zname(ZONES[x.hist[L.r]-1])}</em></span>`).join('')}</div>
           <p class="note" style="margin-top:12px">${tn('time.stuck.note',months)}</p>`
        : blanksHTML(blanks(L.r),tn('time.stuck.blank',months))}
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>${t('time.every')}</h2><span class="n">${t('time.taptoopen')}</span></div>
      <div class="track">
        ${REPORTS.map((r,i)=>{const p=currentPhase(scoresOf(r));
          return `<button class="stop ${i===REPORTS.length-1?'now':''}" data-open="${i}">
            <span class="dot"></span>
            <span class="st-d">${fmtDate(r)}</span>
            <span class="st-p">${pname(PHASES[p-1])}</span>
            <span class="st-n">${tn('time.students',totalAt(r.r))}</span></button>`}).join('')}
      </div>
    </div>
  </div></div>`;
}

   Log a problem the moment you hit it, with a screenshot, without

/* One entry per view, or the note loses the one thing it tags automatically.
   'jesus' and 'notes' were added later and missed, so every note logged from
   the landing page — which is where the app opens — was filed as "Somewhere". */
const SCREENS={jesus:'Like Jesus',today:'Today',map:'Your map',check:'Check-up',
               reports:'Reports',report:'A report',time:'The year',notes:'Notes'};
const screenNow=()=>SCREENS[active]||'Somewhere';

let NOTES=[], draftShots=[], storageOK=null, saveErr=null, loadErr=null, justSaved=false, lastShotsFailed=0, confirmDel=null, loadingNotes=false;

/* ---------- which build am I looking at ----------
   Dave reported the same chart three times, partly because nothing told him
   whether the page in front of him contained the fix. version.json is written
   at deploy; the app reads it once at boot, shows the time in the workbench
   strip, and re-checks on a timer and whenever the tab is refocused. If the
   stamp has moved, the page in front of you is stale and says so. */
let BUILD=null, newerBuild=false;
async function readBuild(){
  try{
    const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
async function checkBuild(first){
  const v=await readBuild();
  if(!v) return;
  if(first){ BUILD=v; }
  else if(BUILD && v.at!==BUILD.at && !newerBuild){ newerBuild=true; }
  render();
}
const buildLabel=()=>{
  if(!onTheWeb()||!BUILD||BUILD.at==='local') return t('build.local');
  const d=new Date(BUILD.at);
  if(isNaN(d)) return t('build.local');
  return t('build.label',{when:d.toLocaleDateString(LANG,{day:'numeric',month:'short'})+
    ', '+d.toLocaleTimeString(LANG,{hour:'2-digit',minute:'2-digit'})});
};

/* What the app knew when a note was written. One line, one field — the tester
   types nothing extra. Added after "still the same problem here the graph" on
   a screen that can show any of four reports. */
function noteContext(){
  const bits=[TIER==='activated'?'Activated':'Open'];
  if(active==='report'&&REPORTS[openIx]) bits.push('report '+fmtDate(REPORTS[openIx]));
  if(active==='check'&&quizIx>0) bits.push('statement '+quizIx+' of '+Q.length);
  bits.push(Math.round(window.innerWidth)+'px');
  bits.push(onTheWeb()?(BUILD&&BUILD.at!=='local'?'build '+buildLabel().replace(/^Build /,''):'build unknown'):'local copy');
  return bits.join(' · ');
}
/* fetch rejecting before any response gives a message no tester can act on
   ("Failed to execute 'fetch' on 'Window'"). Both the load and the save
   paths hit it, so both translate it here rather than one of them. */
/* The common cause is not a network fault: the page is a local copy opened
   off disk or from a preview, where a relative /api path has no host to
   resolve against and can never work. That is every protocol except http
   and https — file:, data:, blob:. */
const onTheWeb=()=>/^https?:$/.test(location.protocol);
const netMsg=()=>onTheWeb()
  ? 'Could not reach the server. Check your connection and try again.'
  : 'This is a local copy of the page, not the live site, so it has no server to save to.';
/* Note text is typed by a tester and rendered into innerHTML. A stray < in
   "students < 12" would swallow the rest of the panel. */
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let WHO=null, askingWho=false;
try{ WHO=localStorage.getItem('workbench-who')||null }catch(e){ WHO=null }
function setWho(v){
  v=(v||'').trim(); if(!v)return;
  WHO=v; try{ localStorage.setItem('workbench-who',v) }catch(e){}
  askingWho=false; render();
  setTimeout(()=>{const t=document.getElementById('bn-text');t&&t.focus()},40);
}

/* Failing to LOAD is not failing to save. It used to set saveErr, so a
   tester who had typed nothing was told in red that their note was not
   saved and was still in the box — with an empty box in front of them. */
async function benchLoad(){
  loadingNotes=true; render();
  try{
    let r;
    try{ r=await fetch(CONFIG.notesEndpoint,{headers:APP_HDR}); }
    catch(netErr){ throw new Error(netMsg()); }
    const body=await r.text();
    if(!r.ok)throw new Error(explain(r.status,body));
    NOTES=JSON.parse(body); storageOK=true; loadErr=null;
  }catch(err){
    storageOK=false; loadErr=null;
    console.warn('workbench notes did not load:', err.message||err);
  }
  loadingNotes=false;
  render();
}

/* explain() is for whoever is fixing the app. It names env vars and base
   ids, and a tester must never see any of it — that is how a feedback bot
   teaches people not to trust the product it is attached to. It goes to the
   console. What the tester sees is one plain sentence about their own note. */
/* A tester reads this sentence and decides whether to phone someone. It has
   to say what happened in words a person can act on, never a browser's own
   error text. */
function explain(status,body){
  let msg=''; try{ const j=JSON.parse(body); msg=(j.error&&(j.error.message||j.error))||j.message||''; }catch(e){ msg=(body||'').slice(0,120); }
  /* The site sits behind a Netlify password. When that session lapses the gate
     answers before our function does, with an HTML page rather than JSON — and
     a bare 401 would otherwise be reported below as an Airtable key problem,
     which is the wrong thing to go and check. */
  const isPage=/^\s*</.test(body||'');
  if((status===401||status===403)&&isPage) return 'Your session with the site expired. Reload the page, enter the password again, and your note will still be here.';
  if(status===404&&/function/i.test(body||'')) return 'The /api/notes function is not deployed.';
  if(status===404) return 'Table not found in that base \u2014 check AIRTABLE_NOTES_TABLE and AIRTABLE_BASE_ID.';
  if((status===401||status===403)&&/not allowed from here/i.test(msg))
    return 'The front door refused this request \u2014 see netlify/functions/lib/guard.js.';
  if(status===429) return 'Rate limited by the front door \u2014 too many requests in a minute.';
  if(status===401||status===403) return 'Airtable rejected the key \u2014 check AIRTABLE_API_KEY and that the token can access this base.';
  if(status===422) return 'A field name does not match the table \u2014 '+msg;
  if(status===500&&/env vars/i.test(msg)) return 'Environment variables are not set on this deploy.';
  return 'HTTP '+status+(msg?' \u2014 '+msg:'');
}
async function benchSave(note){
  try{
    let r;
    try{
      r=await fetch(CONFIG.notesEndpoint,{method:'POST',headers:{'Content-Type':'application/json',...APP_HDR},
        body:JSON.stringify(note)});
    }catch(netErr){ console.error('note save could not reach the server:', netErr);
      throw new Error(location.protocol==='file:'?'this page was opened as a file':'we could not reach the server'); }
    const body=await r.text();
    if(!r.ok){
      console.error('note save failed:', explain(r.status,body));
      throw new Error(/^\s*</.test(body)
        ? 'the page needs reloading first'
        : 'something on our side is not working');
    }
    const saved=JSON.parse(body);
    lastShotsFailed=saved.shotsFailed||0;
    const i=NOTES.findIndex(n=>n.id===note.id); if(i>-1)NOTES[i]=saved;
    storageOK=true; saveErr=null;
  }catch(err){ storageOK=false; saveErr=String(err.message||err); }
  render();
}
async function benchAdd(){
  const t=document.getElementById('bn-text');
  if(!t||!t.value.trim())return;
  const note={id:Date.now(), who:WHO||'Unknown', text:t.value.trim(), area:screenNow(), kind:'idea', context:noteContext(),
    shots:draftShots.slice(), state:'open', at:new Date().toISOString(), reply:null};
  NOTES.push(note);
  const kept=t.value, keptShots=draftShots.slice();
  draftShots=[]; t.value=''; justSaved=false; render();
  await benchSave(note);
  if(saveErr){                       /* put it back so nothing is lost */
    NOTES=NOTES.filter(x=>x.id!==note.id); draftShots=keptShots; render();
    const t2=document.getElementById('bn-text'); if(t2)t2.value=kept;
  }else{
    justSaved=true; render(); setTimeout(()=>{justSaved=false;render()},2600);
  }
}
/* Mark a note fixed, or put it back. The tick moves straight away and the
   save reconciles; if the save fails the tick goes back where it was, so the
   list never claims something is fixed that Airtable never heard about. */
async function benchFix(id){
  const n=NOTES.find(x=>x.id===id); if(!n)return;
  const was=n.state;
  n.state = was==='done' ? 'open' : 'done';
  render();
  await benchSave(n);
  if(saveErr){ const m=NOTES.find(x=>x.id===id); if(m)m.state=was; render(); }
}

/* Screenshots are shrunk before they are sent. Airtable takes 5 MB per
   attachment and Netlify caps a function request around 6 MB, and a retina
   screen grab can approach both. 1600px on the long edge keeps text readable
   and the payload small. */
function shrink(dataUrl,type){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
      if(sc===1) return res(dataUrl);
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      try{ res(c.toDataURL(type==='image/jpeg'?'image/jpeg':'image/png',.92)); }
      catch(e){ res(dataUrl); }
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}
/* Deleting is not reversible — the row leaves Airtable and there is no bin.
   So it takes two clicks, and the second one is a differently-worded button
   rather than the same button again, which is easy to hit twice by accident.
   The row is put back if the server refuses. */
async function benchDelete(id){
  const i=NOTES.findIndex(x=>x.id===id); if(i<0)return;
  const note=NOTES[i];
  confirmDel=null;
  NOTES.splice(i,1); render();
  if(!note.rec) return;                       /* never reached Airtable anyway */
  try{
    const r=await fetch(`${CONFIG.notesEndpoint}?id=${encodeURIComponent(note.rec)}`,
      {method:'DELETE',headers:APP_HDR});
    if(!r.ok){
      console.error('note delete failed:', explain(r.status, await r.text()));
      NOTES.splice(i,0,note); saveErr='we could not delete that one'; render();
    }
  }catch(err){
    console.error('note delete could not reach the server:', err);
    NOTES.splice(i,0,note);
    saveErr=onTheWeb()?'we could not reach the server':'this is a local copy of the page, not the live site';
    render();
  }
}

function benchShot(files){
  [...files].slice(0,3).forEach(file=>{
    const r=new FileReader();
    r.onload=async()=>{ const data=await shrink(r.result,file.type);
      draftShots.push({name:file.name,type:file.type,data}); render(); };
    r.readAsDataURL(file);
  });
}

/* The pencil renders FIRST and inside its own try, on purpose.
   It used to render after the view, so any error in any view took the note
   bot down with it — the one moment you most want to report a problem is the
   moment the screen is broken, and that was exactly when the pencil vanished.
   A broken view now says so on screen instead of going blank. */
/* The <title> tag in the head is the fallback shown before the script runs.
   Once STRINGS is loaded the real one is set from it, so the browser tab is
   in the leader's language too. */
function setDocTitle(){ try{ document.title=plain(t('app.title')); }catch(e){} }

function render(){
  const ta=document.getElementById('bn-text'); const keep=(ta&&ta.value)?ta.value:null;

  try{ document.getElementById('bot').innerHTML=botHTML(); }
  catch(err){ console.error('note bot failed to render', err); }

  try{ document.getElementById('tip').innerHTML=learnMore?learnMoreHTML():toolInfoHTML(); }
  catch(err){ console.error('tool panel failed to render', err); }

  try{

      `<span>${t('tier.viewingas')}</span>${[['open','tier.open'],['activated','tier.activated']].map(([k,l])=>
        `<button class="${TIER===k?'is':''}" data-tier="${k}">${t(l)}</button>`).join('')}
       <button class="tw-notes${active==='notes'?' is':''}" data-go="notes">${t('bot.title')}${open?`<i>${open}</i>`:''}</button>
       ${newerBuild
         ? `<button class="tw-build newer" data-build="reload" title="${t('build.newer')}">${t('build.newer')} &middot; ${t('build.reload')}</button>`
         : `<span class="tw-build">${buildLabel()}</span>`}`;

  setDocTitle();

  try{
    document.getElementById('app').innerHTML=m[active]();
  }catch(err){
    console.error('view "'+active+'" failed to render', err);
    document.getElementById('app').innerHTML=
      `<div class="view"><div class="wrap"><div class="cerr" style="margin-top:40px">
        ${t('err.screen')}<br><br>${t('err.tellus')}<br><br><code style="font-size:12px;opacity:.8">${active}: ${String(err&&err.message||err)}</code>
      </div></div></div>`;
  }

  if(keep!==null){const t2=document.getElementById('bn-text'); if(t2)t2.value=keep;}

document.addEventListener('click',e=>{
  /* Clicking into a count selects it, so a leader types over the number
     rather than appending to it. focusin covers tabbing in; click covers
     the way anyone actually does it. Deliberately does not return. */
  const cv=e.target.closest('[data-cntv]'); if(cv&&cv.select) cv.select();
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
  const cn=e.target.closest('[data-cnt]'); if(cn){const [ix,dv]=cn.dataset.cnt.split(':').map(Number);
    COUNTS[NOW][ix]=Math.max(0,COUNTS[NOW][ix]+dv); render(); return}
  const ak=e.target.closest('[data-ask]'); if(ak){askedCoach=true; render(); return}
  const tg=e.target.closest('[data-tier]'); if(tg){TIER=tg.dataset.tier; selStudent=null; render(); return}
  const q=e.target.closest('[data-q]'); if(q){quizIx=+q.dataset.q;render();return}
  const hit=k=>e.target.closest('[data-'+k+']');
  let t;
  if(t=hit('bot')){botOpen=(t.dataset.bot==='open');render();
    if(botOpen)setTimeout(()=>{const el=document.getElementById(WHO?'bn-text':'bn-who');el&&el.focus()},60);return}
  if(t=hit('who')){
    if(t.dataset.who==='ask'){askingWho=true;render();setTimeout(()=>{const el=document.getElementById('bn-who');el&&el.focus()},40);return}
    setWho(document.getElementById('bn-who').value); return}
  if(t=hit('bench')){if(t.dataset.bench==='add')benchAdd(); return}
  if(t=hit('fix')){benchFix(Number(t.dataset.fix)); return}
  if(t=hit('del')){
    const v=t.dataset.del;
    if(v==='cancel'){confirmDel=null;render();return}
    if(v.startsWith('ask:')){confirmDel=Number(v.slice(4));render();return}
    benchDelete(Number(v)); return}
  if(t=hit('tool')){toolInfo=(t.dataset.tool==='close'||toolInfo===t.dataset.tool)?null:t.dataset.tool;render();return}
  if(t=hit('build')){ location.reload(true); return}
  if(t=hit('notes')){ if(t.dataset.notes==='refresh') benchLoad(); return}
  if(t=hit('learn')){learnMore=(t.dataset.learn==='close'||learnMore===t.dataset.learn)?null:t.dataset.learn;render();return}
  if(t=hit('unshot')){draftShots.splice(+t.dataset.unshot,1);render();return}
  if(t=hit('sel')){selStudent=(selStudent===+t.dataset.sel?null:+t.dataset.sel);addingTo=null;render();return}
  if(t=hit('move')){const[i,z]=t.dataset.move.split(':');moveStudent(+i,+z);return}
  if(t=hit('drop')){dropStudent(+t.dataset.drop);return}
  if(t=hit('adding')){intake=+t.dataset.adding;intakeErr=null;selStudent=null;render();
    setTimeout(()=>{const el=document.getElementById('in-name');el&&el.focus()},40);return}
  if(t=hit('save')){saveIntake();return}
  if(t=hit('close')){ if(t.dataset.close==='bg'&&e.target!==t)return; intake=null;intakeErr=null;render();return}
  if(t=hit('zone')){document.getElementById('in-zone').value=t.dataset.zone;return}
  if(t=hit('prog')){selProgram=+t.dataset.prog;render();return}
  if(t=hit('freq')){const[i,fq]=t.dataset.freq.split(':');PROGRAMS[+i].freq=fq;render();return}
  if(t=hit('inv')){const[i,z]=t.dataset.inv.split(':').map(Number);
    const ch=PROGRAMS[i].ch, k=ch.indexOf(z); k>-1?ch.splice(k,1):ch.push(z); ch.sort(); render();return}
  if(t=hit('pdone')){const el=document.getElementById('pn'+t.dataset.pdone);
    if(el&&el.value.trim())PROGRAMS[+t.dataset.pdone].name=el.value.trim();
    selProgram=null;render();return}
  if(t=hit('pdrop')){PROGRAMS.splice(+t.dataset.pdrop,1);selProgram=null;render();return}
  if(t=hit('newprog')){
    const k=t.dataset.newprog;
    if(k==='open'){addingProgram=true;render();setTimeout(()=>{const el=document.getElementById('newpr');el&&el.focus()},30);return}
    if(k==='cancel'){addingProgram=false;render();return}
    const el=document.getElementById('newpr');
    if(el&&el.value.trim()){PROGRAMS.push({name:el.value.trim(),freq:'Weekly',n:0,ch:[]});
      addingProgram=false;selProgram=PROGRAMS.length-1;render()}
    return}
  const cc=e.target.closest('[data-coach]');
  if(cc){
    const k=cc.dataset.coach;
    if(k==='run'){runCoach();return}
    if(k==='ask'){const i=document.getElementById('cq');askCoach(i&&i.value);return}
    if(k==='names'){CONFIG.sendNames=cc.checked;render();return}
  }
  const op=e.target.closest('[data-open]');
  if(op){openIx=+op.dataset.open;selPhase=null;coachState={loading:false,questions:null,error:null,answer:null,asking:false};active='report';renderTabs();render();window.scrollTo({top:0,behavior:'instant'});return}
  const ps=e.target.closest('[data-phase]');
  if(ps){const n=+ps.dataset.phase;selPhase=(selPhase===n?null:n);render();return}
  const a=e.target.closest('[data-ans]');
  if(a){answers[quizIx-1]=+a.dataset.ans;quizIx++;
    if(quizIx-1>=Q.length){
      const now=new Date(), byPhase={};
      PHASES.forEach(p=>byPhase[p.n]=Q.filter(q=>q.phase===p.n).map(q=>answers[q.id]??A_NONE));
      REPORTS.push({d:now.toISOString().slice(0,10),
                    t:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
                    r:2, a:byPhase});
      openIx=REPORTS.length-1; selPhase=null; active='report'; renderTabs(); render();
      window.scrollTo({top:0,behavior:'instant'});
    } else render();}
});

/* ---------- deep links ----------
   ?screen=report&report=2&tier=activated&phase=3 opens exactly that state.
   Two jobs: a note can link straight to the screen it came from, and a fixed
   screen can be screenshotted headlessly for the before-and-after on the
   notes list. Nothing here is required — a bare URL behaves as it always did. */
(function openFromUrl(){
  let q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  if(![...q.keys()].length) return;
  const set=(k,fn)=>{ const v=q.get(k); if(v!==null) fn(v); };
  set('tier',   v=>{ if(v==='open'||v==='activated') TIER=v; });
  set('screen', v=>{ if(['jesus','today','map','check','reports','report','time','notes'].includes(v)) active=v; });
  set('report', v=>{ const i=+v; if(REPORTS[i]) { openIx=i; active='report'; } });
  set('phase',  v=>{ const n=+v; if(n>=1&&n<=5){ selPhase=n; active='report'; } });
  set('tool',   v=>{ if(TOOLS[v]||Q.some(x=>x.cat===v)){ toolInfo=v; active='report'; } });
  set('learn',  v=>{ if(v==='challenges'||v==='phases'){ learnMore=v; active='jesus'; } });
  set('q',      v=>{ const n=+v; if(n>=0&&n<=Q.length){ quizIx=n; active='check'; } });
  set('student',v=>{ const n=+v; if(STUDENTS[n]){ selStudent=n; active='map'; } });
})();
