<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministry Map + Check-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202E; --ink-70:rgba(22,32,46,.70); --ink-45:rgba(22,32,46,.45); --ink-15:rgba(22,32,46,.15); --ink-08:rgba(22,32,46,.08);
  --ground:#E8EAE6; --surface:#FBFBFA; --line:#D3D7D1;
  --z1:#4C6B8A; --z2:#5E8A88; --z3:#8A9455; --z4:#C58A3B; --z5:#B04A38;
  --mark:#16202E; --phase:#4A3BAE; --phase-08:rgba(74,59,174,.085);
  --r:14px; --maxw:1080px;
  --display:'Fraunces',Georgia,serif; --body:'Archivo',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0;z-index:40}
.mast-in{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.grp{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.grp em{font-style:italic;font-weight:600}
.who{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-45)}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--ink-70);white-space:nowrap}
.tab:hover{background:var(--ink-08)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}

/* ---------- generic ---------- */
.view{padding:34px 0 90px;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-45);margin-bottom:9px}
h1{font-family:var(--display);font-size:clamp(29px,5vw,42px);font-weight:800;letter-spacing:-.022em;line-height:1.08}
h1 em{font-style:italic;font-weight:600}
h2{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.015em}
.lede{font-size:16.5px;color:var(--ink-70);max-width:60ch;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{background:var(--ink);color:var(--surface);padding:13px 22px;border-radius:99px;font-weight:600;font-size:15px;transition:transform .14s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-15)}
.sec{margin-top:38px}
.sec-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.sec-hd .n{font-family:var(--mono);font-size:11px;color:var(--ink-45);letter-spacing:.1em}

/* ---------- zones ---------- */
.zonebar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px}
.zcol{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;display:flex;flex-direction:column}
.zhd{padding:11px 11px 9px;border-top:4px solid var(--zc);position:relative}
.zname{font-size:12.5px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.zcount{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:5px;color:var(--zc)}
.zask{font-size:11px;line-height:1.35;color:var(--ink-45);margin-top:7px;font-style:italic}
.zbody{padding:4px 8px 10px;display:flex;flex-direction:column;gap:3px}
.chip{font-size:12px;padding:4px 8px;border-radius:6px;background:var(--ink-08);display:flex;justify-content:space-between;gap:6px;align-items:center}
.chip .mv{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--z3)}
.chip .mv.back{color:var(--z5)}

/* ---------- known-data confirm ---------- */
.known{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.known-row{display:flex;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);align-items:baseline}
.known-row:last-child{border-bottom:none}
.known-k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-45);min-width:150px;flex-shrink:0}
.known-v{font-size:15px;font-weight:500}
.known-v .src{font-family:var(--mono);font-size:10.5px;color:var(--ink-45);margin-left:8px;letter-spacing:.05em}

/* ---------- quiz ---------- */
.q-shell{max-width:660px;margin:0 auto}
.q-prog{height:3px;background:var(--ink-15);border-radius:99px;overflow:hidden;margin-bottom:30px}
.q-prog i{display:block;height:100%;background:var(--mark);transition:width .3s}
.q-meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45);display:flex;justify-content:space-between;margin-bottom:16px}
.q-text{font-family:var(--display);font-size:clamp(22px,3.6vw,30px);font-weight:600;line-height:1.24;letter-spacing:-.018em;min-height:2.4em}
.q-opts{display:flex;flex-direction:column;gap:9px;margin-top:26px}
.opt{text-align:left;padding:15px 18px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line);font-size:15.5px;font-weight:500;display:flex;gap:13px;align-items:center;transition:border-color .13s,transform .13s}
.opt:hover{border-color:var(--ink);transform:translateX(3px)}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--ink-45);width:14px;flex-shrink:0}

/* ---------- report ---------- */
.stair{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-items:end;height:132px;margin:8px 0 6px}
.stair .st{background:var(--ink-15);border-radius:6px 6px 0 0;position:relative;transition:background .2s,transform .16s;width:100%;display:block;align-self:end}
.stair button.st{cursor:pointer}
.stair button.st:hover{transform:translateY(-3px)}
.stair .st.done{background:var(--ink-45)}
.stair .st.on{background:var(--phase);box-shadow:0 5px 16px rgba(74,59,174,.22)}
.stair .st.sel{outline:2.5px solid var(--phase);outline-offset:3px}
.stair .st .youare{position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;color:var(--phase);white-space:nowrap;font-weight:600}
.stairlab{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stairlab div{font-size:11px;font-weight:600;text-align:center;color:var(--ink-45);line-height:1.2}
.stairlab div.on{color:var(--phase)}
.why-panel{margin-top:20px;border-top:1px solid var(--line);padding-top:20px;animation:rise .28s both}
.ph-head{border-left:3px solid var(--phase);padding-left:18px;margin-bottom:20px}
.ph-essence{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(21px,3.2vw,27px);letter-spacing:-.015em;line-height:1.22;color:var(--phase)}
.ph-stance{font-size:14.5px;color:var(--ink-70);margin-top:9px;max-width:56ch}
.ph-about{font-size:16.5px;line-height:1.62;max-width:64ch}
.ph-turn{margin-top:18px;background:var(--phase-08);border-radius:10px;padding:14px 17px;font-size:15.5px;line-height:1.5;font-weight:500}
.ph-turn span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--phase);margin-bottom:6px;font-weight:600}
.tf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:26px}
.tf-hd{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;padding-bottom:9px;margin-bottom:4px;border-bottom:1.5px solid var(--line);display:flex;justify-content:space-between;font-weight:600}
.tf-hd.true{color:var(--z3);border-color:var(--z3)}
.tf-hd.part{color:var(--z4);border-color:var(--z4)}
.tf-hd.not{color:var(--phase);border-color:var(--phase)}
.tf-hd span{color:var(--ink-45);font-weight:400}
.tf{font-size:14.5px;line-height:1.45;padding:10px 0 10px 22px;position:relative;border-bottom:1px solid var(--ink-08)}
.tf:before{content:'';position:absolute;left:2px;top:16px;width:8px;height:8px;border-radius:99px}
.tf.true:before{background:var(--z3)}
.tf.part:before{background:linear-gradient(90deg,var(--z4) 50%,transparent 50%);box-shadow:inset 0 0 0 1.8px var(--z4)}
.tf.not:before{box-shadow:inset 0 0 0 1.8px var(--phase)}
.tf.not{color:var(--ink-70)}
.tf.none{padding-left:0;font-style:italic;color:var(--ink-45)}
.tf.none:before{display:none}
.ph-carry{margin-top:26px;background:var(--ink-08);border-radius:11px;padding:17px 19px}
.carry-line{font-family:var(--display);font-size:15.5px;font-weight:600;line-height:1.4;padding:5px 0 5px 18px;position:relative}
.carry-line:before{content:'';position:absolute;left:0;top:12px;width:9px;height:1.5px;background:var(--ink-45)}
.ph-foot{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.ph-foot p{font-size:14.5px;line-height:1.55;color:var(--ink-70)}
@media (max-width:900px){.tf-grid{grid-template-columns:1fr}}
@media (max-width:760px){.ph-foot{grid-template-columns:1fr;gap:22px}}

/* coach */
.coach{background:var(--ink);color:var(--surface);border-radius:var(--r);padding:24px;margin-top:14px}
.coach .eyebrow{color:rgba(251,251,250,.5)}
.coach h2{color:var(--surface)}
.coach-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.cbtn{border:1.5px solid rgba(251,251,250,.35);color:var(--surface);border-radius:99px;padding:8px 17px;font-size:13px;font-weight:600;transition:background .14s}
.cbtn:hover:not(:disabled){background:rgba(251,251,250,.13)}
.cbtn:disabled{opacity:.5;cursor:default}
.cbtn.solid{background:var(--surface);color:var(--ink);border-color:var(--surface);flex-shrink:0}
.cq{border-top:1px solid rgba(251,251,250,.15);padding:15px 0;font-family:var(--display);font-size:17.5px;font-weight:600;line-height:1.38;letter-spacing:-.01em}
.cq:first-of-type{border-top:none}
.cq.skel{color:rgba(251,251,250,.5);font-style:italic;font-weight:500;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
.cerr{background:rgba(176,74,56,.28);border-radius:9px;padding:11px 14px;font-size:13px;line-height:1.5;margin-top:14px;color:var(--surface)}
.cask{display:flex;gap:9px;margin-top:18px;padding-top:18px;border-top:1px solid rgba(251,251,250,.15)}
.cask input{flex:1;min-width:0;background:rgba(251,251,250,.09);border:1.5px solid rgba(251,251,250,.2);border-radius:99px;padding:11px 18px;color:var(--surface);font:inherit;font-size:14.5px}
.cask input::placeholder{color:rgba(251,251,250,.42)}
.cask input:focus{outline:none;border-color:rgba(251,251,250,.6)}
.canswer{margin-top:16px;background:rgba(251,251,250,.07);border-radius:11px;padding:16px 18px}
.canswer p{font-size:14.5px;line-height:1.62;margin-bottom:11px}
.canswer p:last-child{margin-bottom:0}
.cfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid rgba(251,251,250,.12);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:rgba(251,251,250,.5)}
.cfoot label{display:flex;gap:7px;align-items:center;color:var(--surface);cursor:pointer}
.cq .from{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.05em;color:rgba(251,251,250,.42);margin-top:8px;text-transform:uppercase}
.bar{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--ink-08)}
.bar .lb{font-size:14px;font-weight:500;min-width:150px}
.bar .vl{font-size:13.5px;font-weight:600;min-width:118px;color:var(--ink-45)}
.bar.true .vl{color:var(--z3)} .bar.part .vl{color:var(--z4)} .bar.not .vl{color:var(--phase)}
.bar .lb{flex:1}
.act{display:flex;gap:15px;padding:17px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:none}
.act .num{font-family:var(--mono);font-size:11px;color:var(--ink-45);padding-top:3px;flex-shrink:0}
.act .bd{font-size:15.5px;line-height:1.5}
.act .bd b{font-weight:700}
.act .why{font-family:var(--mono);font-size:11px;color:var(--ink-45);margin-top:7px;letter-spacing:.03em}
.act .why span{color:var(--z2)}

/* ---------- two roads ---------- */
.roads{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 14px;overflow-x:auto}
.roadkey{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-45)}
.roadkey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* journey dashboard */
.jstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}
.jstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.jstat b{display:block;font-family:var(--display);font-size:clamp(28px,3.6vw,38px);font-weight:800;letter-spacing:-.028em;line-height:1;color:var(--phase)}
.jstat span{display:block;font-size:13.5px;font-weight:600;margin-top:10px;line-height:1.3}
.jstat em{display:block;font-family:var(--mono);font-size:10.5px;font-style:normal;color:var(--ink-45);margin-top:6px;letter-spacing:.03em;line-height:1.4}
.thennow{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.tn-side .cake{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.tn-lab{font-family:var(--display);font-size:15px;font-weight:700;text-align:center;margin-bottom:12px}
.tn-lab span{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--ink-45);margin-top:3px;letter-spacing:.05em}
.tn-arrow{font-size:22px;color:var(--ink-45)}
.tier.sm{padding:6px 9px;border-radius:5px}
.tier.sm .tn{font-size:10px}.tier.sm b{font-size:12px}
.legs{display:flex;gap:4px}
.leg{background:rgba(74,59,174,.16);border-radius:8px;padding:13px 12px;min-width:0}
.leg.now{background:var(--phase)}
.lg-n{display:block;font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-t{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-45);margin-top:4px}
.leg.now .lg-n,.leg.now .lg-t{color:var(--surface)}
.tf .qp{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-45);margin-top:5px;letter-spacing:.04em}
.stuckrow{display:flex;flex-wrap:wrap;gap:8px}
.sc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--zc);border-radius:0 9px 9px 0;padding:9px 13px;font-size:14.5px;font-weight:600}
.sc em{display:block;font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink-45);margin-top:3px}
.track{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stop{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:border-color .14s,transform .14s}
.stop:hover{border-color:var(--phase);transform:translateY(-2px)}
.stop.now{border-color:var(--phase)}
.stop .dot{display:block;width:10px;height:10px;border-radius:99px;background:var(--ink-15);margin-bottom:11px}
.stop.now .dot{background:var(--phase)}
.st-d{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-45);letter-spacing:.05em}
.st-p{display:block;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.012em;margin-top:5px}
.st-n{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-45);margin-top:5px}
@media (max-width:860px){.jstats{grid-template-columns:1fr 1fr}
 .thennow{grid-template-columns:1fr;gap:12px}.tn-arrow{transform:rotate(90deg);text-align:center}
 .legs{flex-direction:column}.leg{width:100%!important}}

/* phase meta + tool box */
.ph-meta{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 4px}
.ph-meta span{font-size:12.5px;background:var(--ink-08);border-radius:8px;padding:7px 12px;color:var(--ink-70)}
.ph-meta b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--phase);margin-right:9px}
.toolbox{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--z4);border-radius:0 var(--r) var(--r) 0;padding:20px 22px}
.tb-head{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.tb-acr{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.1em;color:var(--z4);flex-shrink:0}
.tb-head p{font-size:15px;line-height:1.5;color:var(--ink-70);flex:1;min-width:200px}
.pips{display:inline-flex;gap:3px;flex-shrink:0}
.pips i{width:15px;height:8px;border-radius:2px;background:var(--ink-08)}
.true .pips i.on{background:var(--z3)} .part .pips i.on{background:var(--z4)} .not .pips i.on{background:var(--phase)}
.tb-scale{font-family:var(--mono);font-size:10px;line-height:1.5;color:var(--ink-45);margin-top:14px}
.tb-words{margin-top:10px;display:grid;gap:2px}
.tw{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--ink-08)}
.tw:last-child{border-bottom:none}
.tw-w{min-width:112px;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.tw-v{font-size:14px;font-weight:600;min-width:210px}
.tw.true .tw-v{color:var(--z3)} .tw.part .tw-v{color:var(--z4)} .tw.not .tw-v{color:var(--phase)}
.tw-n{font-family:var(--mono);font-size:10.5px;color:var(--ink-45);margin-left:auto}
@media (max-width:700px){.tw{flex-wrap:wrap;gap:8px 12px}.tw-v{min-width:0;flex:1}.tw-n{width:100%;margin-left:0}}
@media (max-width:560px){.tb-acr{font-size:24px}.tw-w{min-width:88px;font-size:14px}}

/* today: cake + climb */
.duo{display:grid;grid-template-columns:1fr 1px 1fr;margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.duo-rule{background:var(--line)}
.duo-half{padding:22px 24px 20px;display:flex;flex-direction:column;min-width:0}
.duo-vis{flex:1;display:flex;align-items:center;min-height:186px}
.big-n{font-family:var(--display);font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.028em;line-height:1;margin-bottom:18px}
.big-n em{font-style:italic;font-weight:600;font-size:.42em;margin-left:9px;letter-spacing:-.01em}
.big-n.ph{color:var(--phase);font-size:clamp(22px,2.9vw,33px)}
.cake{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.tier{border-radius:7px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;min-width:0;transition:transform .16s}
.tier:hover{transform:scale(1.015)}
.tier .tn{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.tier b{font-family:var(--mono);font-size:16px;font-weight:600;flex-shrink:0}
.tier.empty{background:none!important;box-shadow:inset 0 0 0 1.5px var(--ink-15);color:var(--ink-45)}
.tier.empty b{color:var(--ink-15)}
/* the road — challenges, left to right */
.road{width:100%}
.road-row{display:grid;grid-template-columns:repeat(5,1fr);column-gap:6px}
.road-row.bars{align-items:end;height:96px}
.road-row.bars span{display:flex;align-items:flex-end;justify-content:center;height:100%}
.road-row.bars i{display:block;width:70%;border-radius:6px 6px 0 0;min-height:3px}
.road-row.rail{position:relative;justify-items:center;padding:11px 0 9px}
.road-row.rail::before{content:'';position:absolute;left:10%;right:10%;top:50%;transform:translateY(-50%);height:2px;background:var(--ink-08)}
.mile-dot{width:11px;height:11px;border-radius:50%;position:relative;box-shadow:0 0 0 3px var(--surface)}
.mile-dot.empty{background:var(--surface);box-shadow:0 0 0 3px var(--surface),inset 0 0 0 1.5px var(--ink-15)}
.road-row.labs .lab{text-align:center;min-width:0}
.road-row.labs b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;line-height:1}
.road-row.labs span{display:block;font-size:10px;font-weight:600;color:var(--ink-45);line-height:1.2;margin-top:5px}
.road-row.labs .lab.empty b{color:var(--ink-15)}
/* the phases, as layers anchored on the right */
/* the phases as a cake, anchored on the right. Layer width is the phase
   score, so the taper is the ministry's real shape — same rule as the
   challenge cake: width must equal the thing, never a drawn silhouette.
   phtier, not tier — .tier is the challenge cake in the then/now view. */
.phcake{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:100%}
.phtier{font:inherit;border:0;text-align:left;border-radius:7px;padding:8px 13px;display:flex;flex-direction:column;
        align-items:flex-start;gap:1px;color:#fff;min-width:0;transition:transform .16s}
button.phtier{cursor:pointer}
.phtier.sel{outline:2.5px solid var(--phase);outline-offset:2px}
.phtier:hover{transform:scale(1.015)}
/* name on its own line — a duration is far longer than a number was, and
   side by side it squeezed the phase names into ellipses */
.phtier .phn{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em;max-width:100%}
.phtier b{font-family:var(--mono);font-size:11px;font-weight:600;opacity:.88;white-space:nowrap}
.phtier b:empty{display:none}
/* Colour says where you are, not which phase it is: everything under you is
   cleared ground, the layer you are on is solid, everything above is faint.
   Ramping by phase number made the narrow top layers the darkest, which read
   as the opposite of a cake. */
.phtier.done{background:rgba(74,59,174,.52)}
.phtier.ahead{background:rgba(74,59,174,.2)}
.phtier.on{background:var(--phase);box-shadow:0 5px 16px rgba(74,59,174,.26)}
.phtier.empty{background:none!important;box-shadow:inset 0 0 0 1.5px var(--ink-15);color:var(--ink-45)}
.phtier.empty b{color:var(--ink-15)}
/* ============================================================
   LIKE JESUS — the landing page
   ============================================================ */
.jw{max-width:760px}
.jh{font-size:clamp(38px,6vw,64px);margin-top:6px}
.jh em{font-style:italic;font-weight:600}
.jlede{font-family:var(--display);font-size:clamp(17px,2.1vw,21px);line-height:1.5;font-weight:500;
       color:var(--ink);margin-top:20px;max-width:36em}
.jp{font-size:15.5px;line-height:1.65;color:var(--ink-70);margin-top:18px;max-width:36em}
.jp b{color:var(--ink);font-weight:600}
.jref{font-family:var(--mono);font-size:11.5px;color:var(--ink-45);letter-spacing:.03em;white-space:nowrap}

.jfig{margin:30px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 18px}
.jfig-hd{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-45);margin-bottom:14px}
.jroad{width:100%;height:auto;display:block}
.jr-lab{font-family:var(--mono);font-size:12px;letter-spacing:.11em;fill:var(--ink-45)}
.jr-end{font-family:var(--display);font-style:italic;font-size:19px;font-weight:600;fill:var(--ink-45)}
.jr-n{font-family:var(--mono);font-size:13px;font-weight:600;fill:#fff}
.jr-name{font-size:13px;font-weight:600;fill:var(--ink-70)}
/* right-aligned so the ends line up; the span sits outside on the right */
.jstack{display:grid;grid-template-columns:1fr 96px;gap:5px 14px;align-items:center;margin-top:6px}
.jsbar{display:flex;justify-content:flex-end}
.jsbar i{display:block;font-style:normal;font-size:12.5px;font-weight:600;color:#fff;
         padding:9px 14px;border-radius:7px;background:rgba(74,59,174,var(--t));
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jsyr{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-45);display:flex;align-items:center}
/* one span covering two phases reads as a bracket down the pair */
.jsyr.pair{padding-left:11px;position:relative}
.jsyr.pair::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:6px;
  border:1.5px solid var(--ink-15);border-right:0;border-radius:4px 0 0 4px}
.jstack-note{font-size:11.5px;line-height:1.5;color:var(--ink-45);margin-top:14px;
             padding-top:11px;border-top:1px dashed var(--ink-15)}
.jstack-note b{color:var(--z5)}
@media(max-width:560px){.jstack{grid-template-columns:1fr 78px;gap:5px 9px}.jsbar i{font-size:11.5px;padding:8px 11px}}
.jclimb{height:150px;margin-top:4px}
.jfig-foot{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.jfig-foot span{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-45);text-align:center}

.jlist{margin-top:20px;max-width:36em;display:flex;flex-direction:column;gap:14px;counter-reset:j;list-style:none}
.jlist li{position:relative;padding-left:40px;font-size:15.5px;line-height:1.55;color:var(--ink-70)}
.jlist li::before{counter-increment:j;content:counter(j);position:absolute;left:0;top:1px;
  width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);
  font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.jlist li b{color:var(--ink);font-weight:600}
.jlist li span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-45);margin-top:4px}

.jgo{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 8px}
/* its own buttons: .cbtn is built for the coach panel's dark ground and
   turns almost invisible on a light page */
.jbtn{font:inherit;font-size:14px;font-weight:600;padding:11px 21px;border-radius:99px;cursor:pointer;
      background:none;color:var(--ink);border:1px solid var(--ink-15);transition:border-color .13s,background .13s}
.jbtn:hover{border-color:var(--ink)}
.jbtn.solid{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.jbtn.solid:hover{background:var(--ink-70);border-color:var(--ink-70)}

@media(max-width:640px){
  .jfig-names{grid-template-columns:repeat(2,1fr)}
  .jfig{padding:16px 14px 14px}
}

/* ============================================================
   THE MAP GRID
   One CSS grid for both halves, so the five columns line up across the
   rule — that alignment is the whole information design. Wide content
   scrolls inside its own box; the page never scrolls sideways.
   ============================================================ */
.mgwrap{margin-top:26px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.mgrid{display:grid;grid-template-columns:112px repeat(5,minmax(148px,1fr));min-width:800px;align-items:stretch}

/* left gutter */
.mg-gut{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);background:var(--bg)}
.mg-title{font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:-.01em;padding-top:16px;padding-bottom:14px}
.mg-count{padding-top:9px;padding-bottom:9px}
.mg-count b{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1}
.mg-count span{font-size:10.5px;color:var(--ink-45);margin-top:2px}
.mg-freq{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-45)}

/* the five challenge headings */
/* Each column carries a wash of its own colour the whole way down, so the
   eye can follow one challenge from what you run to who is there without
   counting across. Kept very faint — it is a guide, not a highlight. */
.mg-ch,.mg-num,.mg-cell,.mg-num.edit{background:color-mix(in srgb,var(--zc) 11%,transparent)}
.mg-ch{padding:14px 12px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;line-height:1.25;
       display:flex;align-items:flex-start;gap:7px;box-shadow:inset 0 3px 0 var(--zc);
       background:color-mix(in srgb,var(--zc) 20%,transparent)}
.mg-ch i{font-family:var(--mono);font-style:normal;font-size:10px;font-weight:600;color:var(--zc);flex:none;margin-top:1px}

/* the number row */
.mg-num{padding:9px 12px;font-family:var(--mono);font-size:21px;font-weight:600;border-bottom:1px solid var(--ink-08);
        display:flex;align-items:center;gap:5px}
.mg-num.zero{color:var(--ink-15)}
.mg-num.edit{padding:6px 10px}
.mg-num.edit .cnv{font-size:21px;width:2.6ch;text-align:left}
.mg-num.edit .stp{width:22px;height:22px;font-size:14px}

/* Programme and name cells read as a list down the column, one per line —
   the way the paper form lists them. Chips wrapping side by side turned a
   column of eight students into a block you had to pick apart. */
.mg-cell{padding:6px 7px;border-bottom:1px solid var(--ink-08);display:flex;flex-direction:column;
         align-items:stretch;gap:1px;min-height:44px;justify-content:flex-start}
.mg-dash{color:var(--ink-15);font-size:14px;align-self:flex-start;padding:3px 5px}
.pchip,.schip{font:inherit;font-size:12.5px;line-height:1.3;text-align:left;cursor:pointer;border:0;border-radius:6px;
        width:100%;padding:4px 7px 4px 15px;background:none;color:var(--ink);position:relative;
        display:flex;align-items:baseline;gap:6px;transition:background .12s,color .12s}
/* a small mark in the challenge's colour, so a name still reads as belonging
   to its column once the pill has gone */
.pchip::before,.schip::before{content:'';position:absolute;left:5px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--zc)}
.pchip:hover,.schip:hover{background:color-mix(in srgb,var(--zc) 30%,transparent)}
.pchip.is,.schip.is{background:var(--zc);color:#fff}
.pchip.is::before,.schip.is::before{background:#fff}
.schip .mv{font-family:var(--mono);font-style:normal;font-size:9px;margin-left:auto;opacity:.6;flex:none}
.schip.add{color:var(--ink-45);padding-left:15px;margin-top:3px}
.schip.add::before{background:none;box-shadow:inset 0 0 0 1px var(--ink-15);border-radius:1px}
.schip.add:hover{color:var(--ink);background:none}

/* full-width rows inside the grid */
.mg-wide{grid-column:2 / -1;padding:8px 10px;border-bottom:1px solid var(--ink-08)}
.mg-addb{font:inherit;font-size:12px;font-weight:600;color:var(--ink-45);background:none;border:0;cursor:pointer;padding:5px 4px}
.mg-addb:hover{color:var(--ink)}
.mg-rule{grid-column:1 / -1;height:1px;background:var(--line)}

.mg-note{margin-top:10px;font-size:11.5px;line-height:1.5;color:var(--ink-45)}
/* the panel under the grid */
.mdet{margin-top:14px;background:var(--surface);border:1px solid var(--ink);border-radius:12px;
      padding:15px 17px;box-shadow:0 3px 14px rgba(22,32,46,.07)}
.mdet-hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mdet-hd>b{font-family:var(--display);font-size:17px;font-weight:800}
.mdet-hd>span{font-size:12px;color:var(--ink-45);flex:1;min-width:0}
.mdet-hd .warn{color:var(--z5)}
.mdet-x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;color:var(--ink-45);cursor:pointer;padding:0 2px}
.mdet-x:hover{color:var(--ink)}

@media(max-width:720px){
  .mgrid{grid-template-columns:92px repeat(5,minmax(132px,1fr));min-width:740px}
  .mg-title{font-size:13.5px}
  .mg-count b,.mg-num{font-size:18px}
}

.tnstack{display:flex;flex-direction:column;gap:6px}
.tn-one{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px}
.tn-one.now{border-color:var(--ink-45)}
.tn-lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-45);
        display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.tn-lab span{letter-spacing:.03em}
.ph-ast{color:var(--z5);font-weight:700;font-size:.7em;margin-left:2px;cursor:help}
.ph-note{margin-top:16px;padding-top:12px;border-top:1px dashed var(--ink-15);font-size:11.5px;
         line-height:1.5;color:var(--ink-45)}
.ph-note b{color:var(--z5)}
/* the acronym panel */
.tipwrap{position:fixed;inset:0;z-index:80;background:rgba(22,32,46,.42);display:flex;align-items:center;
         justify-content:center;padding:22px;animation:fade .15s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tip{position:relative;background:var(--surface);border-radius:16px;max-width:560px;width:100%;
     max-height:min(84vh,720px);overflow-y:auto;padding:24px 26px 22px;box-shadow:0 18px 54px rgba(22,32,46,.3);
     animation:rise .2s cubic-bezier(.2,.7,.3,1) both}
.tip-x{position:absolute;top:14px;right:16px;background:none;border:0;font-size:22px;line-height:1;
       color:var(--ink-45);cursor:pointer}
.tip-x:hover{color:var(--ink)}
.tip-hd{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.08em;margin-top:6px}
.tip-spells{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tip-spells span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;
                 background:var(--ink-08);color:var(--ink-70)}
.tip-line{font-family:var(--display);font-size:15.5px;line-height:1.5;font-weight:500;margin-top:14px}
.tip-line.quiet{font-family:var(--body);font-size:13px;font-weight:400;color:var(--ink-45)}
.tip-sec{margin-top:20px;margin-bottom:9px}
.tip-qs{list-style:none;display:flex;flex-direction:column;gap:9px}
.tip-qs li{display:grid;grid-template-columns:14px 1fr;gap:9px;font-size:13.5px;line-height:1.45;color:var(--ink-70)}
.tip-qs i{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--ink-15)}
.tip-qs li.yes i{background:var(--z3)}
.tip-qs li.part i{background:var(--z4)}
.tip-qs li.no i{background:var(--z5)}
.tip-qs em{grid-column:2;font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.05em;
           text-transform:uppercase;color:var(--ink-45);margin-top:3px}
.tip-do{margin-top:18px;padding-top:14px;border-top:1px solid var(--ink-08);font-size:13.5px;
        line-height:1.55;color:var(--ink-70)}
.tip-do b{color:var(--ink)}
/* the tool panel parts are buttons now */
button.tw{font:inherit;text-align:left;border:0;width:100%;cursor:pointer}
button.tw:hover{background:var(--ink-08)}
.tb-acr{font:inherit;background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:19px;
        font-weight:600;letter-spacing:.09em;color:var(--z4);padding:0;border-bottom:1.5px dotted var(--z4)}
.tb-acr:hover{color:var(--ink)}
/* the logged list inside the note bot */
.bot-hint.quiet{color:var(--ink-45)}
.nlist{margin-top:16px;border-top:1px solid var(--ink-08);padding-top:12px}
.nhd{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45);margin-bottom:8px}
.nhd span{letter-spacing:.04em}
.nrow{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer;align-items:flex-start}
.nrow:hover{background:var(--ink-08)}
.ntick{flex:none;width:16px;height:16px;margin-top:2px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--ink-15);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.nrow.done .ntick{background:var(--z3);box-shadow:none}
.ncol{display:flex;flex-direction:column;gap:2px;min-width:0}
.ntt{font-size:12.5px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nmeta{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-45)}
.nrow.done .ntt{color:var(--ink-45);text-decoration:line-through}
.known-why{color:var(--ink-45);font-weight:400}
.known-row.stacked{align-items:flex-start}
.chal-stack{display:flex;flex-direction:column;gap:5px;width:100%}
.chal-row{display:flex;align-items:center;gap:9px;font-size:14px}
.chal-row .chal-dot{width:9px;height:9px;border-radius:50%;flex:none}
.chal-row .chal-n{flex:1;color:var(--ink-70)}
.chal-row b{font-family:var(--mono);font-weight:600}
.plinth{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-45);text-align:center;margin-top:16px;padding-top:13px;border-top:1px solid var(--ink-08)}
.climb{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:end;width:100%;height:186px}
.step{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.step .riser{height:var(--h);border-radius:7px 7px 0 0;background:rgba(74,59,174,var(--t));position:relative}
.step.ahead .riser{background:var(--ink-08)}
.step.on .riser{background:var(--phase);box-shadow:0 5px 16px rgba(74,59,174,.26)}
.step .here{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.09em;color:var(--phase);white-space:nowrap;font-weight:600}
.step .slab{font-size:10.5px;font-weight:600;text-align:center;color:var(--ink-45);margin-top:7px;line-height:1.2}
.step.on .slab{color:var(--phase)}
@media (max-width:900px){
  .duo-half{padding:18px 17px 16px}
  .tier{padding:8px 10px;border-radius:6px}
  .tier .tn{font-size:10.5px}.tier b{font-size:14px}
  .step .slab{font-size:8.5px}
  .duo-vis{min-height:170px}.climb{height:170px}
}
@media (max-width:560px){
  .duo{grid-template-columns:1fr}
  .duo-rule{height:1px}
  .duo-half{padding:20px 20px 18px}
  .tier .tn{font-size:12px}.tier b{font-size:16px}.step .slab{font-size:10px}
}

/* report cards */
.backlink{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-45);margin-bottom:18px;display:block}
.backlink:hover{color:var(--ink)}
.repcard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:grid;grid-template-columns:150px 1fr auto auto;grid-template-areas:'date mid n go';gap:20px;align-items:center;transition:border-color .14s,transform .14s}
.rc-date{grid-area:date}.rc-mid{grid-area:mid}.rc-n{grid-area:n}.rc-go{grid-area:go}
.repcard:hover{border-color:var(--phase);transform:translateX(3px)}
.repcard.newest{border-color:var(--phase);box-shadow:0 3px 14px rgba(74,59,174,.09)}
.repcard.big{margin-top:26px;padding:22px 24px}
.rc-date .d{display:block;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.rc-date .t{font-family:var(--mono);font-size:11px;color:var(--ink-45)}
.rc-phase{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.rc-phase i{width:9px;height:9px;border-radius:99px;background:var(--phase);flex-shrink:0}
.rc-delta{font-family:var(--mono);font-size:11px;color:var(--ink-45);margin-top:5px;letter-spacing:.03em}
.rc-delta b.up{color:var(--z3)} .rc-delta b.dn{color:var(--z5)}
.rc-n{text-align:right}
.rc-n b{display:block;font-family:var(--display);font-size:27px;font-weight:800;line-height:1}
.rc-n span{font-family:var(--mono);font-size:10px;color:var(--ink-45);text-transform:uppercase;letter-spacing:.08em}
.rc-go{font-family:var(--mono);font-size:11px;color:var(--phase);letter-spacing:.05em;white-space:nowrap}

/* report cover */
.cover{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-top:6px}

      <div class="who">Katka &amp; Boža · Czech Republic</div>
    </div>

    <!-- Build tool, not a feature. Delete when auth decides the tier. -->

  </div>

<main id="app"></main>
<div id="bot"></div>
<!-- Outside #app on purpose: .view animates with a transform, and a
     transformed ancestor becomes the containing block for position:fixed,
     which pinned this overlay part-way down the page instead of over it. -->
<div id="tip"></div>
<script>
/* ============================================================
   MINISTRY MAP + CHECK-UP — merge prototype
   Ministry Map app (live roster, zones, movement)
     + M-Lens Diagnostic (Five Phases instrument)
   The join: the check-up stops asking for people/program data
   and reads it from the map instead.
   ============================================================ */

/* ---- Five Challenges of Christ = the map's zones ---- */
/* Each challenge is an INVITATION a leader makes to a student, not a
   place or a programme. A student's position on the map is the
   furthest invitation they have said yes to. `ask` is the invitation
   in plain words; `verb` is how to say it in a sentence. */
const ZONES=[
 {n:1,name:'Come &amp; See',      v:'--z1',
  ask:'Come and look at Jesus for yourself &mdash; nothing is being asked of you yet.',
  verb:'invited to come and see'},
 {n:2,name:'Repent &amp; Believe',v:'--z2',
  ask:'Turn from your old life and give it to Christ.',
  verb:'asked to give their life to Christ'},
 {n:3,name:'Follow Me',        v:'--z3',
  ask:'Let Jesus lead your whole life, not just your Sunday.',
  verb:'asked to follow Jesus daily'},
 {n:4,name:'Follow Me &amp; Fish',v:'--z4',
  ask:'Come with me and help reach the people who are still outside.',
  verb:'asked to help reach others'},
 {n:5,name:'I Am Sending You', v:'--z5',
  ask:'Go and lead this somewhere I am not.',
  verb:'sent out to lead'}
];
const plain=t=>t.replace(/&amp;/g,'&');

/* ---- Five Phases of a Disciplemaking Ministry ----
   Names, audiences and per-phase tools read from Mel's chalkboard diagram.

   ⚠ `span` IS NOT SOURCED. Searched 26 Aug 2026: neither the M-Lens docx
   nor either spreadsheet contains any phase duration — no "30 years", no
   "1.5 years", no "6-9 months", and no phase-level "ongoing". These five
   came from the same unverified chalkboard reading that produced `SIX`,
   and "ongoing" is not even a duration. Everywhere a span is shown it
   carries the placeholder asterisk. Get the real figures from JV and
   delete this notice.
   The M-Lens source calls phase 3 "Equipping" and phase 5
   "Multiplication"; Mel's names are used, as corrected by him. ---- */
const PHASES=[
 {n:1,name:'Preparation',            span:'30 years',    who:'Everyone', tool:'CCE'},
 {n:2,name:'Foundation',             span:'1.5 years',   who:'Disciples',tool:'SIX'},
 {n:3,name:'Ministry Training',      span:'6\u20139 months', who:'Workers',  tool:'TAR'},
 /* Ministry Training and Expansion share one span: Mel, 26 Aug 2026 —
    the 6-9 months covers both, and the diagram brackets them together. */
 {n:4,name:'Expansion',              span:'6\u20139 months', who:'Workers',  tool:'CPR'},
 {n:5,name:'Leadership Multiplication',short:'Leadership Mult.',span:'1.5 years',who:'Leaders',tool:'REST'}
];
PHASES[4].tool='REST';
const pname=p=>p.short||p.name;

/* ============================================================
   QUESTION BANK — the real M-Lens instrument
   Statements verbatim from `M lens diagnostic - personal.docx`;
   `cat` is the source's own Category column from
   `M Lens Diagnostic v2.xlsx`, not a guess. 5 phases x 7.
   ============================================================ */

/* An answer and what an answer is worth are two different things, and
   this instrument is the reason to keep them apart.

   WHAT THE LEADER SAYS is one of four, the same four on every screen.
   Stored as 0-3. The source's own labels are "Not at all / A Little /
   Some / Much"; the truth labels below are kept over them, because a
   statement takes a truth label.

   WHAT IT IS WORTH depends on the phase. The source scores "Some" as 8
   in Preparation and Foundation but 6 from Ministry Training on — the
   later phases are graded harder, because they are harder. A leader who
   is "mostly true" across the board clears Preparation and does not
   clear Ministry Training. That is the instrument working, not a bug.

   Storing the answer and deriving the worth means this stays one table
   to edit. Nothing has to be migrated if the grading is ever retuned. */

   one shows no data at all, so a drawn taper claims nothing.) */
function phaseYearsHTML(){
  /* Every cell is placed explicitly. Two adjacent phases can share one span,
     and a year cell that spans two rows breaks grid auto-placement — the bar
     below it walks into the wrong column. */
  const order=[...PHASES].reverse();
  let cells='', skip=false;
  order.forEach((p,i)=>{
    const w=100-(p.n-1)*12;                  /* 100 at the base, 52 at the top */

    cells+=`<span class="jsbar" style="grid-row:${i+1};grid-column:1">
      <i style="width:${w}%;--t:${t}">${pname(p)}</i></span>`;
    if(skip){skip=false;return}
    const nxt=order[i+1], pair=nxt&&nxt.span===p.span;
    cells+=`<span class="jsyr${pair?' pair':''}" style="grid-row:${i+1}${pair?' / span 2':''};grid-column:2">
      ${p.span}<sup class="ph-ast">*</sup></span>`;
    if(pair) skip=true;
  });
  return `<div class="jstack">${cells}</div>`;

/* How long this ministry has been in each phase, read from the check-up
   history — which is the only record of it there is.

   WHAT WOULD MAKE THESE WRONG: a check-up is not a measurement, it is a
   sighting. A leader who does not check up for a year moves phases silently
   and the app cannot know when. So every figure here is "first seen in this
   phase on…", a bound rather than a duration, and it reads long — the real
   move happened at some point before the check-up that noticed it. Phases
   already behind the leader at their first check-up get no figure at all,
   because there is nothing to read. */
function phaseSpans(){
  const seenAt={};
  REPORTS.forEach(r=>{ const n=currentPhase(scoresOf(r)); if(!(n in seenAt)) seenAt[n]=r.d; });
  const last=REPORTS[REPORTS.length-1].d, out={};
  PHASES.forEach(p=>{
    const from=seenAt[p.n];
    if(!from){ out[p.n]=null; return; }
    const moved=REPORTS.find(r=>r.d>from && currentPhase(scoresOf(r))>p.n);
    out[p.n]={months:monthsBetween(from, moved?moved.d:last), current:!moved};
  });
  return out;
}
/* The phases cake, shared by Today and by a report so the two cannot drift
   apart. `tappable` makes each layer a button that opens what that phase
   is about; Today just shows it. */
function phaseCakeHTML(sc,ph,tappable){
  const spans=phaseSpans();
  return `<div class="phcake">${[...PHASES].reverse().map(p=>{
    const st=p.n===ph?'on':(p.n<ph?'done':'ahead'), v=sc[p.n];
    /* 48% floor so the longest phase name still fits in an empty layer */
    const w=48+52*(v/10);
    const cls=`phtier ${st} ${v?'':'empty'}${tappable&&selPhase===p.n?' sel':''}`;
    const inner=`<span class="phn">${pname(p)}</span><b>${spans[p.n]?spanLabel(spans[p.n]):(p.n<ph?'&mdash;':'')}</b>`;
    return tappable
      ? `<button class="${cls}" style="width:${w}%" data-phase="${p.n}" aria-label="${p.name}">${inner}</button>`
      : `<div class="${cls}" style="width:${w}%">${inner}</div>`;
  }).join('')}</div>`;
}

const spanLabel=x=>{
  if(!x) return '';
  const m=x.months;
  const t=m<1?'under a month':m<18?`${m} month${m===1?'':'s'}`
      :m%12===0?`${m/12} years`:`${Math.floor(m/12)}y ${m%12}m`;
  return x.current?`${t} so far`:t;
};

/* The road: five milestones left to right, column height = how many people.
   Used on Today. The vertical cake below is still the then/now comparison. */
function roadHTML(ri,opts){
  const o=opts||{};
  const c=zoneCounts(ri);
  /* Two roads compared side by side MUST share a scale. Scaled to their own
     maximum they look identical however much the group grew. */
  const mx=o.mx||Math.max(1,...c);
  return `<div class="road">
    <div class="road-row bars">${ZONES.map((z,i)=>
      `<span>${c[i]?`<i style="height:${12+80*(c[i]/mx)}%;background:var(${z.v})"></i>`:''}</span>`).join('')}</div>
    <div class="road-row rail">${ZONES.map((z,i)=>
      `<span class="mile-dot${c[i]?'':' empty'}" style="${c[i]?`background:var(${z.v})`:''}"></span>`).join('')}</div>
    <div class="road-row labs">${ZONES.map((z,i)=>
      `<div class="lab${c[i]?'':' empty'}"><b>${c[i]}</b><span>${z.name}</span></div>`).join('')}</div>
  </div>`;
}

/* ---------- MAP ----------
   Editable. This is the only place data changes; everything else
   in the app reads from it. Moving a student here updates the
   current snapshot, so the road, the report and the check-up
   auto-fill all follow. */
let selStudent=null, addingTo=null, selProgram=null, addingProgram=false, toolInfo=null;
const NOW=2;                       /* the current roster snapshot */

/* ============================================================
   TIER — what this leader has actually given us
   `open`      signed up on their own. Counts and programmes. There is no
               roster, so there are no names to hide — the app is honest
               about what it cannot see rather than greying it out.
   `activated` signed up for coaching with the national organisation and
               had their group activated. The roster exists.
   Wire this to the session when auth lands. Until then it is a switch,
   and the switch in the masthead is a build tool, not a feature.
   ============================================================ */
let TIER='open';
const hasNames=()=>TIER==='activated';

/* What an open-tier leader types in: how many students at each
   invitation, at each check-up. In the activated tier the same numbers
   are counted off the roster instead, so the two can never disagree.
   Seeded from the demo roster here so both tiers show the same group. */
const COUNTS=DATES.map((d,di)=>{const c=[0,0,0,0,0];
  STUDENTS.forEach(st=>{const z=st.hist[di];if(z)c[z-1]++});return c});
/* the four bands the paper Ministry Map uses, in its order */
const FREQS=['Weekly','Bi-weekly','Monthly','Yearly'];

function moveStudent(id,z){
  const st=STUDENTS.find(x=>x.id===id);if(!st)return;
  const today=new Date().toISOString().slice(0,10);
  for(let k=1;k<=z;k++) if(!st.yes[k]) st.yes[k]=today;   /* dated crossing, not a silent overwrite */
  Object.keys(st.yes).forEach(k=>{if(+k>z)delete st.yes[k]});
  st.hist[NOW]=z;st.zone=z;selStudent=null;render();
}
function dropStudent(id){const i=STUDENTS.findIndex(x=>x.id===id);if(i>-1)STUDENTS.splice(i,1);selStudent=null;render()}
let intake=null, intakeErr=null;
const val=id=>{const el=document.getElementById(id);return el?el.value:''};

function saveIntake(){
  const first=val('in-name').trim(), init=val('in-init').trim().toUpperCase().slice(0,1);
  const name=first+(init?' '+init+'.':'');
  if(!first){intakeErr='A first name is the one thing this cannot go without.';render();return}
  const z=+val('in-zone')||1, came=val('in-came');
  const h=[0,0,0]; h[NOW]=z;
  STUDENTS.push({id:Math.max(0,...STUDENTS.map(x=>x.id))+1,name,hist:h,zone:z,
    age:val('in-age'), came, invitedBy:came==='Invited by a student'?(val('in-by')||null):null,
    knownBy:val('in-known')||null, since:val('in-since')||new Date().toISOString().slice(0,10),
    yes:(()=>{const y={},since=val('in-since')||new Date().toISOString().slice(0,10),
      today=new Date().toISOString().slice(0,10);
      for(let k=1;k<=z;k++)y[k]=k===1?since:today; return y})(),
    note:val('in-note').trim()||null});
  intake=null;intakeErr=null;render();
}

/* Programmes carry no student data — a name-free view, so both tiers
   get it unchanged. This is most of what makes the open tier worth
   using: "nobody is ever sent out to lead" needs no roster at all. */
/* ============================================================
   THE MAP, in the form the training actually draws it
   Five challenge columns. Programmes above, people below, sharing the
   same columns — which is the entire point of the sheet: you can read
   straight down and see an invitation that has a programme but nobody,
   or people but no programme that ever makes it.
   The open tier has no names, so its People half is the number row and
   stops there. Same form, less in it.
   ============================================================ */
function mapGridHTML(){
  const named=hasNames();
  const c=zoneCounts(NOW), tot=c.reduce((a,b)=>a+b,0), cov=coverage();
  const inCell=(zn,fq)=>PROGRAMS.map((p,pi)=>({p,pi})).filter(x=>x.p.ch.includes(zn)&&x.p.freq===fq);

  let h='<div class="mgwrap"><div class="mgrid">';

  h+='<div class="mg-gut mg-title">Programs</div>';
  h+=ZONES.map(z=>`<div class="mg-ch" style="--zc:var(${z.v})"><i>${z.n}</i>${z.name}</div>`).join('');

  h+=`<div class="mg-gut mg-count"><b>${PROGRAMS.length}</b><span>running</span></div>`;
  h+=ZONES.map(z=>{const n=cov[z.n].length;
    return `<div class="mg-num${n?'':' zero'}" style="--zc:var(${z.v})">${n}</div>`}).join('');

  FREQS.forEach(fq=>{
    h+=`<div class="mg-gut mg-freq">${fq}</div>`;
    h+=ZONES.map(z=>{const items=inCell(z.n,fq);
      return `<div class="mg-cell" style="--zc:var(${z.v})">${items.length
        ? items.map(x=>`<button class="pchip${selProgram===x.pi?' is':''}" data-prog="${x.pi}" style="--zc:var(${z.v})">${esc(x.p.name)}</button>`).join('')
        : '<span class="mg-dash">&ndash;</span>'}</div>`}).join('');
  });
  h+='<div class="mg-gut mg-freq"></div>';
  h+='<div class="mg-wide"><button class="mg-addb" data-newprog="open">+ Add a programme</button></div>';

  h+='<div class="mg-rule"></div>';

  h+='<div class="mg-gut mg-title">People</div>';
  h+=ZONES.map(z=>`<div class="mg-ch" style="--zc:var(${z.v})"><i>${z.n}</i>${z.name}</div>`).join('');

  h+=`<div class="mg-gut mg-count"><b id="cnt-tot">${tot}</b><span>students</span></div>`;
  h+=ZONES.map((z,i)=>named
      ? `<div class="mg-num${c[i]?'':' zero'}" style="--zc:var(${z.v})">${c[i]}</div>`
      : `<div class="mg-num edit" style="--zc:var(${z.v})">
           <button class="stp" data-cnt="${i}:-1" aria-label="One fewer">&minus;</button>
           <input class="cnv" id="cnv${i}" data-cntv="${i}" type="text" inputmode="numeric"
                  value="${c[i]}" aria-label="How many at ${plain(z.name)}">
           <button class="stp" data-cnt="${i}:1" aria-label="One more">+</button>
         </div>`).join('');

  if(named){
    h+='<div class="mg-gut mg-freq">Names</div>';
    h+=ZONES.map(z=>{const inz=STUDENTS.filter(x=>x.hist[NOW]===z.n);
      return `<div class="mg-cell" style="--zc:var(${z.v})">${inz.map(x=>{
        const d=x.hist[NOW]-(x.hist[1]||x.hist[NOW]);
        const tag=!x.hist[1]?'<i class="mv">new</i>':d>0?`<i class="mv">+${d}</i>`:d<0?`<i class="mv back">${d}</i>`:'';
        return `<button class="schip${selStudent===x.id?' is':''}" data-sel="${x.id}" style="--zc:var(${z.v})">${esc(x.name)}${tag}</button>`;
      }).join('')}<button class="schip add" data-adding="${z.n}" aria-label="Add a student here">+</button></div>`}).join('');
  }

  h+='</div></div>';
  /* The two totals do not have to agree and it is not an error: a programme
     may make two challenges, so the row across can come to more than the
     number running. The paper form has the same property. */
  const sum=ZONES.reduce((t,z)=>t+cov[z.n].length,0);
  h+=`<p class="mg-note">Read down a column: what you run, and who is there.${
    sum>PROGRAMS.length?' A programme can make two challenges, so the numbers across add up to more than the number running.':''}</p>`;
  return h;
}

/* What an acronym stands for, and what it is measured by.

   The letters of TAR and CPR are teaching, not measurement: the instrument
   scores each tool as one category, so there are no per-letter numbers to
   show and none are invented here. What the panel can honestly show is the
   statements behind the score and how the leader answered them — the ones
   that are not yet true are the nearest thing to "what to do next" that this
   data supports. Fuller teaching for each letter belongs to JV's own
   training material and should be added here from it, not written by us. */
function toolInfoHTML(){
  if(!toolInfo) return '';
  const R=rep(), isAcr=!!TOOLS[toolInfo];
  const T=isAcr?TOOLS[toolInfo]:TOOLS[CAT_TOOL[toolInfo]||Object.keys(TOOLS).find(k=>TOOLS[k].words.includes(toolInfo))];
  if(!T) return '';
  const acr=Object.keys(TOOLS).find(k=>TOOLS[k]===T);
  const ph=PHASES[T.phase-1];
  const qs=Q.filter(q=>isAcr?q.phase===T.phase&&T.words.includes(q.cat):q.cat===toolInfo);
  const notYet=qs.filter(q=>ansIn(R,q)<A_TRUE);
  return `<div class="tipwrap" data-tool="close"><div class="tip" role="dialog" aria-label="${isAcr?acr:toolInfo}">
    <button class="tip-x" data-tool="close" aria-label="Close">&times;</button>
    <div class="eyebrow">${pname(ph)} &middot; JV training tool</div>
    <div class="tip-hd">${isAcr?acr:toolInfo}</div>
    ${isAcr
      ? `<div class="tip-spells">${T.spells.map(w=>`<span>${w}</span>`).join('')}</div>
`
      : `<p class="tip-line quiet">Measured in ${pname(ph)}, alongside ${T.words.filter(w=>w!==toolInfo).join(', ')}.</p>`}
    <div class="eyebrow tip-sec">${isAcr
      ? `The ${qs.length} statements of this phase`
      : `${qs.length} statement${qs.length===1?'':'s'} measure${qs.length===1?'s':''} this`}</div>
    <ul class="tip-qs">${qs.map(q=>{const a=ansIn(R,q);
      return `<li class="${a>=A_TRUE?'yes':a===A_NONE?'no':'part'}"><i></i><span>${q.t}</span>
        <em>${isAcr?`${q.cat} &middot; `:''}${SCALE[a].t}</em></li>`}).join('')}</ul>
    ${notYet.length
      ? `<p class="tip-do"><b>Where to start.</b> ${notYet.length===1?'This one is':`These ${notYet.length} are`} not yet true of you. ${acr} is the tool you already have for ${notYet.length===1?'it':'them'}.</p>`
      : `<p class="tip-do"><b>All of these are true of you.</b> Nothing here is the thing holding this phase back.</p>`}
  </div></div>`;
}

/* ---------- CHECK-UP ----------
   Screen 0 is the whole point of the merge: the sections M-Lens
   used to ask a leader to fill in by hand, answered from the map. */
function vCheck(){

  /* Every row on this screen claims to come off the map, so every row has to
     be computed. Three of them used to be typed into the HTML by hand. */
  const covC=coverage();
  const madeBy=ZONES.filter(z=>covC[z.n].length).length;
  const neverMade=ZONES.filter(z=>!covC[z.n].length);

  if(quizIx===0){
    return `<div class="view"><div class="wrap"><div class="q-shell">
      <div class="eyebrow">Ministry check-up · step 1 of 2</div>
      <h1>You have already done <em>half of this</em></h1>

      <div class="known">

        <div class="known-row stacked"><div class="known-k">People</div>
          <div class="known-v"><div class="chal-stack">${ZONES.map((z,i)=>
            `<div class="chal-row"><span class="chal-dot" style="background:var(${z.v})"></span><span class="chal-n">${z.name}</span><b>${c[i]}</b></div>`).join('')}</div></div></div>

        <div class="known-row"><div class="known-k">Not covered</div><div class="known-v">${neverMade.length
          ? `${neverMade.map(z=>z.name).join(' · ')} <span class="known-why">&mdash; nothing you run asks ${neverMade.length===1?'this':'these'}</span>`
          : 'Nothing &mdash; every challenge has something that asks it'}</div></div>
      </div>

}

/* ---------- REPORTS: the archive ----------
   Every check-up keeps its own dated report. Nothing overwrites. */
function vReports(){
  const rows=REPORTS.map((r,i)=>{
    const sc=scoresOf(r), ph=currentPhase(sc), tot=totalAt(r.r);
    const prev=i>0?REPORTS[i-1]:null;
    const pph=prev?currentPhase(scoresOf(prev)):null;
    const dt=prev?tot-totalAt(prev.r):null;
    let delta='';
    if(prev){
      const bits=[];
      if(ph>pph) bits.push(`<b class="up">stepped up from ${pname(PHASES[pph-1])}</b>`);
      else if(ph<pph) bits.push(`<b class="dn">back to ${pname(PHASES[ph-1])}</b>`);
      else bits.push('same phase');
      if(dt>0) bits.push(`+${dt} students`); else if(dt<0) bits.push(`${dt} students`);
      const g=reportGist(r); if(g.weakest) bits.push(`weakest: ${g.weakest}`);
      delta=bits.join(' · ');
    } else { const g0=reportGist(r); delta='first check-up'+(g0.weakest?` &middot; weakest: ${g0.weakest}`:''); }
    return {r,i,sc,ph,tot,delta};
  }).reverse();

  return `<div class="view"><div class="wrap">
    <div class="eyebrow">${REPORTS.length} check-ups kept</div>
    <h1>Every time you check in,<br>you keep <em>the whole picture</em></h1>
    <p class="lede">Nothing gets written over. Take a check-up whenever it helps — every one is kept.</p>
    <div style="margin-top:26px;display:flex;flex-direction:column;gap:10px">
      ${rows.map(x=>`<button class="repcard ${x.i===REPORTS.length-1?'newest':''}" data-open="${x.i}">
        <div class="rc-date"><span class="d">${fmtDate(x.r)}</span><span class="t">${x.r.t}</span></div>
        <div class="rc-mid">
          <div class="rc-phase"><i></i>${pname(PHASES[x.ph-1])}</div>
          <div class="rc-delta">${x.delta}</div>
        </div>
        <div class="rc-n"><b>${x.tot}</b><span>students</span></div>
        <div class="rc-go">Open &rarr;</div>
      </button>`).join('')}
    </div>
    <p class="note" style="margin-top:18px">Each one keeps what was true the day you took it, so you can look back and see how far your group has come.</p>
  </div></div>`;
}

/* ---------- REPORT ---------- */
function vReport(){
  const R=rep(), sc=scoresOf(R), ph=currentPhase(sc), cats=catScores(R);
  const c=zoneCounts(R.r), tot=c.reduce((a,b)=>a+b,0);
  const cov=coverage();
  const prev=openIx>0?REPORTS[openIx-1]:null;
  const pph=prev?currentPhase(scoresOf(prev)):null;
  const ranked=Object.entries(cats).sort((a,b)=>a[1].v-b[1].v);
  const low=ranked.slice(0,3);

  const weakFreq=ZONES.map(z=>({z,best:Math.max(0,...cov[z.n].map(p=>FREQ_RANK[p.freq]))})).filter(x=>x.best===1)[0];
  const gapZone=ZONES.find(z=>!cov[z.n].length);
  const acts=[];
  if(weakFreq){const wz=weakFreq.z, only=cov[wz.n][0];
    acts.push({b:`<b>Students are only ${wz.verb} once a year.</b> ${c[wz.n-1]+c[0]} of them have not been asked yet, and ${only.name} is the only time it happens. That invitation does not need a programme — it needs someone willing to make it more often than once a year.`,
    w:`instrument: <span>CPR &mdash; ${band(cats.CPR.v).s}</span> &middot; map: ${only.name} runs ${only.freq.toLowerCase()}`});}
  if(gapZone) acts.push({b:`<b>You never actually ask anyone to go.</b> ${c[4]} student has been sent, and ${c[3]} more have reached Follow Me &amp; Fish &mdash; but none of them has been asked to lead something of their own. That is a conversation, not a programme.`,
    w:`instrument: <span>Entrust &mdash; ${band(cats.Entrust.v).s}</span> &middot; map: ${zoneCounts(R.r)[3]} at Follow Me &amp; Fish, none sent`});
  const used=acts.map(a=>a.w).join(' ');
  const fresh=low.find(k=>!used.includes(k[0]))||low[0];
  acts.push({b:`<b>${fresh[0]} is your weakest untouched area &mdash; ${band(fresh[1].v).s}.</b> That is the work of ${PHASES[ph-1].name} &mdash; the phase you have just entered, not a failure of the one you left.`,
    w:`instrument: ${fresh[0]} from ${fresh[1].n} statement${fresh[1].n>1?'s':''}, lowest of ${ranked.length}`});

  return `<div class="view"><div class="wrap">
    <button class="backlink" data-go="reports">&larr; All reports</button>

    <div class="cover">
      <div class="cover-date">${fmtDate(R)} &middot; ${R.t}${openIx===REPORTS.length-1?' <span class="pill">LATEST</span>':''}</div>
      <div class="cover-grid">
        <div class="cv"><b>${tot}</b><span>students on the map</span></div>
        <div class="cv"><b class="ph">${pname(PHASES[ph-1])}</b><span>phase ${ph} of 5${prev&&ph>pph?` &middot; up from ${pname(PHASES[pph-1])}`:''}</span></div>
        <div class="cv"><b>${c[3]+c[4]}</b><span>at Follow Me &amp; Fish or beyond</span></div>
        <div class="cv"><b>${ZONES.filter(z=>cov[z.n].length).length}<span class="of">/5</span></b><span>invitations your programs make</span></div>
      </div>
      <div class="cover-bar">${c.map((n,i)=>n?`<div style="flex:${n};background:var(${ZONES[i].v})"></div>`:'').join('')}</div>
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>What phase you are in</h2><span class="n">TAP A LAYER</span></div>
      <div class="card">
        ${phaseCakeHTML(sc,ph,true)}
        <p class="note" style="margin-top:12px">Each layer is how far that phase is cleared. ${selPhase?'':'Tap any layer to read what that phase is about, and what is true of you in it.'}</p>
        ${selPhase?phaseWhy(selPhase,ph,R):''}
      </div>
    </div>

    ${(()=>{const tk=PHASES[ph-1].tool,T=TOOLS[tk];
      const parts=T.words.map(w=>[w,cats[w]]).filter(x=>x[1]);
      return `<div class="sec">
      <div class="sec-hd"><h2>How ${pname(PHASES[ph-1])} works</h2><span class="n">JV TRAINING TOOL</span></div>
      <div class="toolbox">
        <div class="tb-head"><button class="tb-acr" data-tool="${tk}" title="What ${tk} stands for">${tk}</button><p>${T.spells.join(' &middot; ')}</p></div>
        <p class="tb-scale">How often each part of this phase actually happens, read from your own answers.</p>
        <div class="tb-words">
          ${parts.map(x=>{const b=band(x[1].v);return `<button class="tw ${b.k}" data-tool="${x[0]}"><div class="tw-w">${x[0]}${isTool(x[0])&&T.letters.length===1&&x[0]!==tk?` <span class="acrtag mine">${tk}</span>`:''}</div>
            ${pips(x[1].v)}<div class="tw-v">${doingBand(x[1].v)}</div>
            <div class="tw-n">${x[1].n} statement${x[1].n>1?'s':''}</div></button>`}).join('')}
        </div>
      </div>
      ${(()=>{const w=parts.slice().sort((a,b)=>a[1].v-b[1].v)[0];
        if(!w) return '';
        return `<p class="note" style="margin-top:12px">Weakest part: <b>${w[0]}</b>. ${
          w[0]===tk
            ? `${tk} is the tool for this phase &mdash; ${T.spells.join(', ').toLowerCase()}. You already have it; this is the part of the phase you are furthest from, so it is the tool to go back to rather than something new to learn.`
          : isTool(w[0])
            ? `That is one part of ${tk}, the tool for this phase. The tool is the answer, not the diagnosis.`
            : `${tk} is the tool for this phase. This part is measured beside it, and it is the one you are furthest from.`}</p>`})()}
    </div>`})()}

    <div class="sec">
      <div class="sec-hd"><h2>Do this next</h2><span class="n">FROM BOTH SOURCES</span></div>
      ${acts.map((a,ix)=>`<div class="act"><div class="num">0${ix+1}</div><div class="bd">${a.b}<div class="why">${a.w}</div></div></div>`).join('')}
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>Questions worth sitting with</h2><span class="n">COACH</span></div>
      ${coachHTML()}
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>Where each invitation gets made</h2><span class="n">MAP DATA &mdash; NOT RE-ENTERED</span></div>
      <div class="zonebar">
        ${ZONES.map((z,i)=>`<div class="zcol" style="--zc:var(${z.v})">
          <div class="zhd"><div class="zname">${z.name}</div><div class="zcount">${c[i]}</div></div>
          <div class="zbody">${cov[z.n].length?cov[z.n].map(p=>`<div class="chip"><span>${p.name}</span><span class="mv ${p.freq==='Yearly'?'back':''}">${p.freq}</span></div>`).join(''):'<div class="chip" style="background:none;box-shadow:inset 0 0 0 1.5px var(--ink-15);color:var(--ink-45);font-style:italic">not covered</div>'}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>Every category</h2><span class="n">${ranked.length} MEASURED</span></div>
      ${ranked.map(k=>{const b=band(k[1].v),acr=CAT_TOOL[k[0]],mine=CAT_PHASE[k[0]]===ph;
        return `<div class="bar ${b.k}"><div class="lb">${k[0]}${acr?`<span class="acrtag ${mine?'mine':''}">${acr}</span>`:''}${mine?'<span class="tag">your phase</span>':''}</div>${pips(k[1].v)}<div class="vl">${b.l}</div></div>`}).join('')}
    </div>
  </div></div>`;
}

/* the story of a phase, read from the statements */

/* Two kinds of content on this card, and they are marked apart.
   Sourced: the phase name, its tool and what the acronym spells, who it is
   aimed at, how long it typically runs, and the leader's own answers.
   Placeholder: everything from STORY, which was written here. It carries an
   asterisk and a footnote saying so, so nobody reads it as JV's teaching. */
function phaseWhy(n,cur,R){
  const p=PHASES[n-1], st=STORY[n];
  const qs=Q.filter(q=>q.phase===n).map(q=>({...q,a:ansIn(R,q)}));
  const tiers=[
    {k:'true', hd:'True of you',        list:qs.filter(q=>q.a>=A_TRUE)},
    {k:'part', hd:'Starting to be true',list:qs.filter(q=>q.a===A_LITTLE)},
    {k:'not',  hd:'Not yet true',       list:qs.filter(q=>q.a===A_NONE)}
  ];
  const prev=n>1?Q.filter(q=>q.phase===n-1).map(q=>({...q,a:ansIn(R,q)})).sort((a,b)=>b.a-a.a).slice(0,2):[];
  const sc=scoresOf(R);

  let stance;
  if(n===cur) stance='This is where you are now.';
  else if(n<cur) stance='You have come through this.';
  else stance=`Not yet &mdash; this is on the other side of ${pname(PHASES[cur-1])}.`;

  const tk=p.tool, T=TOOLS[tk];
  return `<div class="why-panel">
    <div class="ph-head">
      <div class="ph-essence">&ldquo;${st.essence}&rdquo;<sup class="ph-ast" title="Placeholder wording">*</sup></div>
      <div class="ph-stance">${stance} ${sc[n].toFixed(1)} out of 10.</div>
    </div>
    <div class="ph-meta">
      <span><b>${tk}</b>${T.spells.join(' &middot; ')}</span>
      <span><b>Aimed at</b>${p.who}</span>
      <span><b>Typically</b>${p.span}<sup class="ph-ast">*</sup></span>
    </div>

    <p class="ph-about">${st.about}<sup class="ph-ast">*</sup></p>
    ${st.turn?`<div class="ph-turn"><span>The turn<sup class="ph-ast">*</sup></span>${st.turn}</div>`:''}

    <div class="tf-grid">
      ${tiers.map(t=>`<div>
        <div class="tf-hd ${t.k}">${t.hd}<span>${t.list.length}</span></div>
        ${t.list.length?t.list.map(q=>`<div class="tf ${t.k}">${q.t}</div>`).join(''):'<div class="tf none">&mdash;</div>'}
      </div>`).join('')}
    </div>

    ${prev.length?`<div class="ph-carry">
      <div class="eyebrow">Strongest in ${pname(PHASES[n-2])}, the phase before</div>
      ${prev.map(q=>`<div class="carry-line">${q.t}</div>`).join('')}
    </div>`:''}

    <div class="ph-foot">
      <div><div class="eyebrow">Where this goes wrong<sup class="ph-ast">*</sup></div><p>${st.risk}</p></div>
      <div><div class="eyebrow">${n===5?'When you are here':`How you know you have finished ${pname(p)}`}<sup class="ph-ast">*</sup></div><p>${st.door}</p></div>
    </div>

    <p class="ph-note"><b>*</b> Placeholder wording, written for this prototype &mdash; not JV&rsquo;s. These parts need the real text.</p>
  </div>`;
}

/* ---------- COACH ----------
   Live. Talks to Claude with the report AND the roster in the prompt —
   which is the whole reason the merge is worth doing: neither source
   alone can produce a question with a student's name in it.
   In production this call goes through a Netlify function so the key
   stays server-side; set CONFIG.coachEndpoint and it will use that. */
const CONFIG={coachEndpoint:'/api/claude', notesEndpoint:'/api/notes', sendNames:true};
let coachState={loading:false,questions:null,error:null,answer:null,asking:false};

function coachPayload(){
  const R=rep(), sc=scoresOf(R), ph=currentPhase(sc), cats=catScores(R);
  const c=zoneCounts(R.r), cov=coverage(), P=PHASES[ph-1], T=TOOLS[P.tool];
  const anon=x=>CONFIG.sendNames?x.name:'a student';
  const F=REPORTS[0];
  return {
    takenAt:R.d+' '+R.t,
    phase:P.name, aimedAt:P.who,
    tool:{acronym:P.tool, isLetterOfTool:T.letters,
          parts:T.words.map(w=>cats[w]?`${w}: ${band(cats[w].v).l.toLowerCase()} (from ${cats[w].n} statement${cats[w].n>1?'s':''})`:w)},
    trueOfUs:Q.filter(q=>q.phase===ph&&ansIn(R,q)>=A_TRUE).map(q=>q.t),
    notYetTrue:Q.filter(q=>q.phase===ph&&ansIn(R,q)===A_NONE).map(q=>q.t),
    furthestInvitationSaidYesTo:ZONES.map((z,i)=>({invitation:plain(z.name),means:plain(z.ask),students:c[i]})),
    programs:PROGRAMS.map(p=>({name:p.name,runs:p.freq,wheretheseinvitationsgetmade:p.ch.map(x=>plain(ZONES[x-1].name))})),
    invitationsNeverMade:ZONES.filter(z=>!cov[z.n].length).map(z=>plain(z.name)),
    ...(hasNames()?{
      movedForwardSinceLastCheckup:STUDENTS.filter(x=>x.hist[1]&&x.hist[R.r]>x.hist[1]).map(anon),
      notMovedInTenMonths:STUDENTS.filter(x=>x.hist[F.r]&&x.hist[F.r]===x.hist[R.r]).map(anon)
    }:{
      /* Say the absence out loud. Left unsaid, the model invents a student. */
      noRosterYet:'This leader has given counts, not students. You do not know any student individually, and you must not write as though you do. Ask about the pattern, never about a person.'
    }),
    language:'English'
  };
}

const COACH_SYS=`You are a coach for youth leaders in Central and Eastern Europe, working inside Josiah Venture's Five Phases framework.
The Five Challenges of Christ are INVITATIONS a leader makes to a student, not programmes, events or containers. "Repent & Believe" means asking a student to turn from their old life and give it to Christ. "I Am Sending You" means asking a student to go and lead somewhere you are not. A student's position on the map is the furthest invitation they have said yes to. Never write as though a challenge is a place a student sits in, a thing a programme "carries", or an event on a calendar — write about who has been asked and who has not.
You are given one ministry check-up: the leader's own answers about their ministry, AND live data about the actual students on their map.
Write questions a wise mentor would ask — specific, warm, never flattering and never scolding. Ground every question in something concrete from the data, preferring facts that combine BOTH sources (e.g. a low score next to a real student who is stuck).
Never give advice or action steps. Only questions. A good question makes the leader think of the answer themselves.
Never smuggle your suggestion into the question. Do not name a month, a programme, an event or a plan the leader has not mentioned — "what stops you from asking in November?" is your idea wearing a question mark. Ask about the pattern instead: what stops you asking more often, what has kept you from asking them, what would have to change. The leader supplies the when and the how.
Return ONLY a JSON array, no preamble and no markdown fences:
[{"q":"the question, 1-2 sentences","from":"the evidence, under 12 words, lowercase"}]
Exactly 3 objects.`;

async function callClaude(system,user,maxTokens){
  const r=await fetch(CONFIG.coachEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens||1000,system,messages:[{role:'user',content:user}]})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  return (d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');
}

async function runCoach(){
  coachState={loading:true,questions:null,error:null,answer:null,asking:false}; render();
  try{
    const txt=await callClaude(COACH_SYS,'Here is the check-up:\n\n'+JSON.stringify(coachPayload(),null,1));
    const clean=txt.replace(/```json|```/g,'').trim();
    const arr=JSON.parse(clean.slice(clean.indexOf('['),clean.lastIndexOf(']')+1));
    coachState={loading:false,questions:arr,error:null,answer:null,asking:false};
  }catch(err){ coachState={loading:false,questions:null,error:String(err.message||err),answer:null,asking:false}; }
  render();
}

async function askCoach(q){
  if(!q||!q.trim())return;
  coachState={...coachState,asking:true,answer:null}; render();
  try{
    const txt=await callClaude(
      'You are a coach for a youth leader, working inside Josiah Venture\'s Five Phases framework. You are given their ministry check-up and their live student roster. Answer in 2-4 short paragraphs, plain and warm, grounded in the data you were given. Cite specific numbers or students where they support the point. If the data cannot answer the question, say so plainly rather than guessing.',
      'The check-up:\n\n'+JSON.stringify(coachPayload(),null,1)+'\n\nThe leader asks: '+q, 1000);
    coachState={...coachState,asking:false,answer:txt};
  }catch(err){ coachState={...coachState,asking:false,answer:null,error:String(err.message||err)}; }
  render();
}
