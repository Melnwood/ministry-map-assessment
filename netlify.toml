[build]
  publish    = "."
  functions  = "netlify/functions"

[[redirects]]
  from = "/api/claude"
  to   = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/notes"
  to   = "/.netlify/functions/notes"
  status = 200

# The app calls only its own origin. Nothing third-party loads except the fonts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # same-origin, not no-referrer: the app's own reads need a Referer to
    # identify themselves to netlify/functions/lib/guard.js. Nothing leaks
    # off-site either way.
    Referrer-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
