[build]
  publish    = "."
  functions  = "netlify/functions"

[[redirects]]
  from = "/api/claude"
  to   = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/notes"
  to   = "/.netlify/functions/notes"
  status = 200

# The app calls only its own origin. Nothing third-party loads except the fonts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
